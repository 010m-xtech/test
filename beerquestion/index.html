<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ビール体験アプリ</title>
    <style>
        body { font-family: sans-serif; background: #fff8e1; text-align: center; padding: 20px; color: #333; }
        .container { background: white; padding: 20px; border-radius: 15px; max-width: 450px; margin: 0 auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .hidden { display: none !important; }
        .q-title { font-weight: bold; margin-top: 20px; display: block; text-align: left; }
        label { display: block; text-align: left; margin: 8px 0; cursor: pointer; }
        textarea { width: 95%; height: 60px; margin-top: 10px; border-radius: 5px; border: 1px solid #ccc; padding: 5px; }
        video { width: 100%; border-radius: 10px; margin-top: 15px; background: #000; }
        button { width: 100%; padding: 15px; margin-top: 20px; background: #ffc107; border: none; border-radius: 30px; font-weight: bold; cursor: pointer; font-size: 1.1em; }
        
        /* おみくじエリアの設定 */
        #result-area {
            min-height: 340px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 20px 0;
        }

        /* 箱がカタカタ揺れるアニメーション */
        @keyframes katakata {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(10deg); }
            50% { transform: rotate(-10deg); }
            75% { transform: rotate(10deg); }
            100% { transform: rotate(0deg); }
        }
        .shaking {
            animation: katakata 0.1s infinite;
        }

        /* 紙がパッと出るアニメーション */
        @keyframes pop-up {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .result-paper {
            width: 210px;
            height: 319px;
            animation: pop-up 0.4s ease-out forwards;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            border-radius: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="step-video">
        <h2>こだわりを見てから挑戦！</h2>
        <video id="myVideo" src="https://010m-xtech.github.io/mymovie/NoLang_test20260422.mp4" playsinline muted autoplay></video>
        <div style="margin-top: 10px;">
            <button id="muteBtn" onclick="toggleMute()" style="width: 80%; background: #4CAF50; font-size: 0.9em; padding: 10px; color:white;">
                🔊 音を出す（ミュート解除）
            </button>
        </div>
        <p id="video-msg" style="margin-top: 10px;">動画を最後まで見てね...</p>
        <button id="toSurveyBtn" class="hidden" onclick="showSurvey()">アンケートに答えて挑戦！</button>
    </div>

    <div id="step-survey" class="hidden">
        <h2>🍺 生ビールアンケート</h2>
        <span class="q-title">1. 当店の生ビールは何点ですか？</span>
        <select id="score" style="width: 100%; padding: 10px; margin-top:10px;">
            <option value="5">5点（最高！）</option>
            <option value="4">4点</option>
            <option value="3">3点</option>
            <option value="2">2点</option>
            <option value="1">1点</option>
        </select>
        <span class="q-title">2. こだわりを感じますか？（複数選択可）</span>
        <label><input type="checkbox" id="check1"> クリーミーな泡</label>
        <label><input type="checkbox" id="check2"> なめらかな口当たり</label>
        <label><input type="checkbox" id="check3"> 雑味のない味わい</label>
        <label><input type="checkbox" id="check4"> 液：泡＝7：3</label>
        <label><input type="checkbox" id="check5"> こだわりを感じる</label>
        <span class="q-title">3. 飲んだ感想を教えてください</span>
        <textarea id="comment" placeholder="感想をお聞かせください"></textarea>
        <button id="sendBtn" onclick="saveSurveyAndGoGame()">回答して運試しへ！</button>
    </div>

    <div id="step-janken" class="hidden">
        <h2>🍺 運試しおみくじ 🍺</h2>
        <div id="result-area">
            <div id="omikuji-box-wrapper">
                <img id="box-img" src="omikuji_box.png" style="width:65px; height:139px;">
            </div>
            <div id="display" style="font-weight: bold; font-size: 1.2em; margin-top: 20px;">
                今日の運勢はどうかな？
            </div>
        </div>
        <div id="controls">
            <button onclick="startOmikuji()" style="background: #ff9800;">おみくじを引く！</button>
        </div>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const shopName = urlParams.get('shop') || "不明な店舗";
    const GAS_URL = "あなたのGASウェブアプリURL"; // ★ここに自分のURLを貼る

    let surveyData = {};

    async function sendStepLog(stepName) {
        try {
            await fetch(GAS_URL, {
                method: "POST",
                mode: "no-cors",
                body: JSON.stringify({ shop: shopName, step: stepName })
            });
        } catch (e) { console.error(e); }
    }

    window.onload = () => {
        sendStepLog("①URLアクセス");
        const v = document.getElementById('myVideo');
        v.onended = () => {
            document.getElementById('video-msg').innerText = "アンケートにご協力お願いします";
            document.getElementById('toSurveyBtn').classList.remove('hidden');
            if(document.getElementById('muteBtn')) document.getElementById('muteBtn').classList.add('hidden');
        };
    };

    function toggleMute() {
        const v = document.getElementById('myVideo');
        const btn = document.getElementById('muteBtn');
        if (v.muted) {
            v.muted = false; v.volume = 1.0;
            btn.innerText = "🔇 音を消す"; btn.style.background = "#ccc";
        } else {
            v.muted = true;
            btn.innerText = "🔊 音を出す"; btn.style.background = "#4CAF50";
        }
    }

    function showSurvey() {
        sendStepLog("②動画視聴完了");
        document.getElementById('step-video').classList.add('hidden');
        document.getElementById('step-survey').classList.remove('hidden');
    }

    function saveSurveyAndGoGame() {
        sendStepLog("③アンケート回答完了");
        surveyData = {
            shop: shopName,
            score: document.getElementById('score').value,
            comment: document.getElementById('comment').value,
            p1: document.getElementById('check1').checked,
            p2: document.getElementById('check2').checked,
            p3: document.getElementById('check3').checked,
            p4: document.getElementById('check4').checked,
            p5: document.getElementById('check5').checked
        };
        document.getElementById('step-survey').classList.add('hidden');
        document.getElementById('step-janken').classList.remove('hidden');
    }

    function startOmikuji() {
        const boxWrapper = document.getElementById('omikuji-box-wrapper');
        const boxImg = document.getElementById('box-img');
        const display = document.getElementById('display');
        const controls = document.getElementById('controls');

        controls.classList.add('hidden');
        display.innerText = "シャカシャカ... 何が出るかな？";
        boxImg.classList.add('shaking');

        setTimeout(() => {
            const results = [
                { grade: "大吉", img: "1daikichi.png" },
                { grade: "中吉", img: "2chukichi.png" },
                { grade: "小吉", img: "3shokichi.png" },
                { grade: "吉",   img: "4kichi.png" },
                { grade: "末吉", img: "5suekichi.png" }
            ];

            const result = results[Math.floor(Math.random() * results.length)];

            // クーポン表示処理を削除
            boxWrapper.innerHTML = `<img src="${result.img}" class="result-paper">`;
            display.innerText = ""; 

            // 最終送信（完走ログ）
            sendFinalData(`おみくじ結果：${result.grade}`);
        }, 1200);
    }

    async function sendFinalData(resultMessage) {
        const payload = { ...surveyData, gameResult: resultMessage };
        try {
            await fetch(GAS_URL, { method: "POST", mode: "no-cors", body: JSON.stringify(payload) });
        } catch (e) { console.error(e); }
    }
</script>
</body>
</html>
