<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D飲食店ルーレット</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle, #2c3e50, #0f171e);
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }
        #ui-container {
            position: absolute;
            top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
            width: 100%;
            pointer-events: none;
        }
        #result-display {
            font-size: 26px;
            font-weight: bold;
            color: #fff;
            background: rgba(231, 76, 60, 0.9);
            padding: 12px 30px;
            border-radius: 50px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
            text-align: center;
            min-width: 200px;
            border: 2px solid #f1c40f;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        .arrow {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 40px solid #e74c3c;
            filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.5));
            z-index: 5;
            pointer-events: none;
        }
        .hint {
            position: absolute;
            bottom: 30px;
            color: rgba(255,255,255,0.7);
            font-size: 14px;
            background: rgba(0,0,0,0.4);
            padding: 8px 20px;
            border-radius: 20px;
            pointer-events: none;
            z-index: 10;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui-container">
        <div id="result-display">画面をスワイプして回してね！</div>
    </div>
    
    <div class="arrow"></div>
    <div id="canvas-container"></div>
    <div class="hint">ルーレットを指でお好みの方向にスワイプ！</div>

<script>
// --- 景品の設定（8等分） ---
const prizes = [
    "ポテト無料券 🍟",
    "ハズレ（もう一回） 😢",
    "ドリンク1杯無料 🍹",
    "ハズレ（もう一回） 😢",
    "トッピング無料 🥚",
    "ハズレ（もう一回） 😢",
    "デザート半額 🍨",
    "ハズレ（もう一回） 😢"
];
const colors = [0xe74c3c, 0x34495e, 0x2ecc71, 0x34495e, 0xf1c40f, 0x34495e, 0x9b59b6, 0x34495e];

// --- Three.js 基本設定 ---
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();

// カメラの設定（立体感が出る遠近カメラ）
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 6, 8); // 斜め上から見下ろすアングル
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true; // 影を有効化してリアルに
container.appendChild(renderer.domElement);

// --- 照明（ライティング）でリアルさを演出 ---
const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(5, 10, 7);
dirLight.castShadow = true;
scene.add(dirLight);

// --- 3Dルーレット盤の作成 ---
const rouletteGroup = new THREE.Group(); // 回転させるためのグループ

// 盤面の土台（厚みのある円柱）
const wheelRadius = 3;
const wheelThickness = 0.4;
const segments = 8;

for (let i = 0; i < segments; i++) {
    // 扇形の3D形状を作成
    const thetaStart = (i * Math.PI * 2) / segments;
    const thetaLength = (Math.PI * 2) / segments;
    
    const geometry = new THREE.CylinderGeometry(wheelRadius, wheelRadius, wheelThickness, 32, 1, false, thetaStart, thetaLength);
    // リアルな質感を出すマテリアル（金属光沢風）
    const material = new THREE.MeshStandardMaterial({
        color: colors[i],
        roughness: 0.3,
        metalness: 0.2
    });
    const wedge = new THREE.Mesh(geometry, material);
    wedge.receiveShadow = true;
    wedge.castShadow = true;
    rouletteGroup.add(wedge);
}

// センターのピン（軸）
const pinGeo = new THREE.CylinderGeometry(0.2, 0.2, 0.6, 16);
const pinMat = new THREE.MeshStandardMaterial({ color: 0xd4af37, metalness: 0.8, roughness: 0.2 }); // 金色
const pin = new THREE.Mesh(pinGeo, pinMat);
pin.position.y = 0.1;
rouletteGroup.add(pin);

// ルーレットを少し手前に傾けて見やすくする
rouletteGroup.rotation.x = 0.4; 
scene.add(rouletteGroup);

// --- 回転の物理挙動ロジック ---
let isDragging = false;
let previousMousePosition = { x: 0 };
let rotationSpeed = 0;
const friction = 0.985; // 減速の度合い（1に近づくほど長く回る）
let isSpinning = false;

// マウス・タッチイベントの登録
window.addEventListener('mousedown', (e) => { startDrag(e.clientX); });
window.addEventListener('mousemove', (e) => { doDrag(e.clientX); });
window.addEventListener('mouseup', () => { endDrag(); });

window.addEventListener('touchstart', (e) => { startDrag(e.touches[0].clientX); });
window.addEventListener('touchmove', (e) => { doDrag(e.touches[0].clientX); });
window.addEventListener('touchend', () => { endDrag(); });

function startDrag(x) {
    if (isSpinning) return;
    isDragging = true;
    previousMousePosition.x = x;
}

function doDrag(x) {
    if (!isDragging) return;
    const deltaX = x - previousMousePosition.x;
    // スワイプの動きに合わせてルーレットのY軸（3D空間上の上方向）を回す
    rouletteGroup.rotation.y += deltaX * 0.01;
    rotationSpeed = deltaX * 0.05; // 離した時の勢い
    previousMousePosition.x = x;
}

function endDrag() {
    if (!isDragging) return;
    isDragging = false;
    if (Math.abs(rotationSpeed) > 0.05) {
        isSpinning = true;
        document.getElementById('result-display').innerText = "まわるまわる...🌀";
    }
}

// どこのセグメントが矢印（真上）に止まったかを計算する関数
function checkResult() {
    // 3Dの回転角を0〜2πの範囲に丸める
    let angle = rouletteGroup.rotation.y % (Math.PI * 2);
    if (angle < 0) angle += Math.PI * 2;
    
    // 真正面（上の矢印）の基準位置に合わせるための補正
    const segmentAngle = (Math.PI * 2) / segments;
    // 矢印は上（Z軸の手前側）にあるため、角度のオフセットを調整
    let prizeIndex = Math.floor(((Math.PI * 2 - angle) + segmentAngle / 2) / segmentAngle) % segments;
    
    document.getElementById('result-display').innerText = `結果：${prizes[prizeIndex]}`;
}

// --- メインループ（描画の更新） ---
function animate() {
    requestAnimationFrame(animate);

    // 勢いよく回っている時の処理
    if (isSpinning) {
        rouletteGroup.rotation.y += rotationSpeed;
        rotationSpeed *= friction; // 摩擦で徐々に減速

        // 一定の遅さになったらストップ
        if (Math.abs(rotationSpeed) < 0.001) {
            rotationSpeed = 0;
            isSpinning = false;
            checkResult();
        }
    }

    renderer.render(scene, .camera);
}
animate();

// 画面サイズが変更された時のレスポンシブ対応
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
