<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>本格3Dメニューカジノルーレット</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0b2e13; /* カジノテーブルを模した深いグリーン */
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }
        #top-info {
            width: 100%;
            background: rgba(0,0,0,0.4);
            padding: 10px 0;
            text-align: center;
            color: #f1c40f;
            font-weight: bold;
            font-size: 14px;
            letter-spacing: 1px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 10;
        }
        #canvas-container {
            width: 100%;
            height: 45vh; /* 画面の上部半分を3D空間に */
            position: relative;
            z-index: 1;
        }
        #bottom-ui {
            width: 100%;
            height: 50vh;
            background: #14191f;
            border-top: 4px solid #f1c40f;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
            padding: 15px 0;
            box-sizing: border-box;
            z-index: 10;
        }
        /* メニュー対応表のボードデザイン */
        #menu-board {
            width: 90%;
            background: #0f3d1a;
            border: 2px solid #fff;
            border-radius: 8px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 5px;
            padding: 8px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }
        .board-cell {
            color: #white;
            font-size: 12px;
            padding: 6px;
            border-radius: 4px;
            border: 1px solid rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            font-weight: bold;
        }
        .num-tag {
            background: #fff;
            color: #333;
            padding: 2px 6px;
            border-radius: 3px;
            margin-right: 8px;
            font-size: 11px;
        }
        .num-tag.red { background: #e74c3c; color: #fff; }
        .num-tag.black { background: #2c3e50; color: #fff; }
        .num-tag.green { background: #2ecc71; color: #fff; }

        /* コントロールボタン */
        #action-btn {
            width: 160px;
            height: 50px;
            font-size: 18px;
            font-weight: bold;
            color: #120924;
            background: linear-gradient(135deg, #f1c40f, #f39c12);
            border: 2px solid #fff;
            border-radius: 25px;
            box-shadow: 0 5px 15px rgba(241,196,15,0.4);
            cursor: pointer;
            transition: all 0.1s ease;
        }
        #action-btn:active {
            transform: scale(0.95);
            box-shadow: 0 2px 5px rgba(241,196,15,0.2);
        }
        #action-btn.stop-mode {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: #fff;
            box-shadow: 0 5px 15px rgba(231,76,60,0.4);
        }

        /* 豪華メニューポップアップ（当選時） */
        #menu-card-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            width: 280px;
            background: linear-gradient(135deg, #134e1e, #0b2e13);
            border: 4px solid #f1c40f;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9), 0 0 30px #f1c40f;
            z-index: 100;
            text-align: center;
            padding: 25px;
            color: #fff;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #menu-card-overlay.show {
            transform: translate(-50%, -50%) scale(1);
        }
        #menu-card-title {
            font-size: 14px;
            color: #f1c40f;
            font-weight: bold;
            margin-bottom: 5px;
        }
        #menu-card-num {
            font-size: 16px;
            color: #fff;
            margin-bottom: 10px;
        }
        #menu-card-name {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }
        #close-btn {
            background: #f1c40f;
            color: #0b2e13;
            border: none;
            padding: 8px 25px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="top-info">CASINO MENU ROULETTE</div>
    
    <div id="canvas-container">
        <div id="menu-card-overlay">
            <div id="menu-card-title">🎯 当選メニュー決定 🎯</div>
            <div id="menu-card-num" id="card-number-text">No. 0</div>
            <div id="menu-card-name" id="menu-item-text">メニュー名</div>
            <button id="close-btn" onclick="closeOverlay()">閉じる</button>
        </div>
    </div>
    
    <div id="bottom-ui">
        <div id="menu-board">
            <div class="board-cell"><span class="num-tag green">0</span>お店からの秘密の一品 🎁</div>
            <div class="board-cell"><span class="num-tag red">1-4</span>フライドポテト 🍟</div>
            <div class="board-cell"><span class="num-tag black">5-9</span>特製から揚げ 🍗</div>
            <div class="board-cell"><span class="num-tag red">10-14</span>ミニサラダ 🥗</div>
            <div class="board-cell"><span class="num-tag black">15-19</span>ウーロン茶 🥤</div>
            <div class="board-cell"><span class="num-tag red">20-24</span>バニラアイス 🍨</div>
            <div class="board-cell"><span class="num-tag black">25-29</span>おつまみ枝豆 🫛</div>
            <div class="board-cell"><span class="num-tag red">30-36</span>本日のデザート 🍰</div>
        </div>

        <button id="action-btn" onclick="handleAction()">START</button>
    </div>

<script>
// --- 本物のヨーロピアンルーレットの出目配列（0〜36がこの順で並んでいます） ---
const wheelNumbers = [0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36, 11, 30, 8, 23, 10, 5, 24, 16, 33, 1, 20, 14, 31, 9, 22, 18, 29, 7, 28, 12, 35, 3, 26];

// 各数字に対するメニュー判定関数
function getMenuByNumber(num) {
    if (num === 0) return { name: "お店からの秘密の一品 🎁", range: "0" };
    if (num >= 1 && num <= 4) return { name: "フライドポテト 🍟", range: "1-4" };
    if (num >= 5 && num <= 9) return { name: "特製から揚げ 🍗", range: "5-9" };
    if (num >= 10 && num <= 14) return { name: "ミニサラダ 🥗", range: "10-14" };
    if (num >= 15 && num <= 19) return { name: "ウーロン茶 🥤", range: "15-19" };
    if (num >= 20 && num <= 24) return { name: "バニラアイス 🍨", range: "20-24" };
    if (num >= 25 && num <= 29) return { name: "おつまみ枝豆 🫛", range: "25-29" };
    if (num >= 30 && num <= 36) return { name: "本日のデザート 🍰", range: "30-36" };
}

// マスの色設定
function getNumberColor(num) {
    if (num === 0) return 0x2ecc71; // 緑
    const redNumbers = [1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];
    return redNumbers.includes(num) ? 0xe74c3c : 0x2c3e50; // 赤か黒
}

// --- Three.js セットアップ ---
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(40, container.clientWidth / container.clientHeight, 0.1, 1000);
camera.position.set(0, 4.8, 4.2); 
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
container.appendChild(renderer.domElement);

// ライティング
const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
dirLight.position.set(3, 8, 3);
dirLight.castShadow = true;
scene.add(dirLight);

// --- 3Dルーレットホイール（37分割の円盤）の作成 ---
const wheelGroup = new THREE.Group();
const wheelRadius = 1.8;
const wheelThickness = 0.3;
const totalSegments = 37;

for (let i = 0; i < totalSegments; i++) {
    const thetaStart = (i * Math.PI * 2) / totalSegments;
    const thetaLength = (Math.PI * 2) / totalSegments;
    
    const geometry = new THREE.CylinderGeometry(wheelRadius, wheelRadius, wheelThickness, 32, 1, false, thetaStart, thetaLength);
    const material = new THREE.MeshStandardMaterial({
        color: getNumberColor(wheelNumbers[i]),
        roughness: 0.3,
        metalness: 0.4
    });
    const wedge = new THREE.Mesh(geometry, material);
    wedge.castShadow = true;
    wedge.receiveShadow = true;
    wheelGroup.add(wedge);
}

// コーン型のセンターコラム（カジノ風の金色の突起）
const coneGeo = new THREE.ConeGeometry(0.3, 0.6, 16);
const coneMat = new THREE.MeshStandardMaterial({ color: 0xd4af37, metalness: 0.8, roughness: 0.2 });
const cone = new THREE.Mesh(coneGeo, coneMat);
cone.position.y = 0.2;
wheelGroup.add(cone);

wheelGroup.rotation.x = 0.3; // 傾けて見やすくする
scene.add(wheelGroup);

// --- リアルな「球」の作成 ---
const ballRadius = 0.08;
const ballGeo = new THREE.SphereGeometry(ballRadius, 32, 32);
const ballMat = new THREE.MeshStandardMaterial({ color: 0xf1f2f6, metalness: 0.5, roughness: 0.2 });
const ballMesh = new THREE.Mesh(ballGeo, ballMat);
ballMesh.castShadow = true;
scene.add(ballMesh);

// --- 豪華演出用：金色の紙吹雪 ---
const particleCount = 80;
const particleGeometry = new THREE.BufferGeometry();
const particlePositions = new Float32Array(particleCount * 3);
const particleVelocities = [];

for (let i = 0; i < particleCount; i++) {
    particlePositions[i * 3] = (Math.random() - 0.5) * 4;
    particlePositions[i * 3 + 1] = Math.random() * 4 + 2;
    particlePositions[i * 3 + 2] = (Math.random() - 0.5) * 4;
    particleVelocities.push({ x: (Math.random() - 0.5) * 0.03, y: -Math.random() * 0.04 - 0.01, z: (Math.random() - 0.5) * 0.03 });
}
particleGeometry.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
const particleMaterial = new THREE.PointsMaterial({ color: 0xf1c40f, size: 0.08, transparent: true, opacity: 0 });
const particleSystem = new THREE.Points(particleGeometry, particleMaterial);
scene.add(particleSystem);

// --- ゲーム制御用ロジック ---
let gameState = "READY"; // READY, SPINNING, STOPPING, BALL_DROP, WIN
let wheelSpeed = 0.01;   // 盤面は最初常時ゆっくり回っている
let ballAngle = 0;
let ballSpeed = 0;
let ballOrbitRadius = wheelRadius - 0.15;
let targetNumberIndex = 0;

updateBallPosition();

function handleAction() {
    const btn = document.getElementById('action-btn');
    
    if (gameState === "READY") {
        gameState = "SPINNING";
        btn.innerText = "STOP";
        btn.classList.add('stop-mode');
        wheelSpeed = 0.08;  // 盤面加速
        ballSpeed = -0.15;  // 球を逆方向に射出
        ballOrbitRadius = wheelRadius - 0.15; // 外枠の外周を回る
    } 
    else if (gameState === "SPINNING") {
        gameState = "STOPPING";
        btn.innerText = "減速中...";
        btn.disabled = true;
    }
}

function updateBallPosition() {
    const cos = Math.cos(ballAngle) * ballOrbitRadius;
    const sin = Math.sin(ballAngle) * ballOrbitRadius;
    ballMesh.position.set(cos, 0.12, sin);
    ballMesh.position.applyAxisAngle(new THREE.Vector3(1, 0, 0), 0.3); // ホイールの傾きに同期
}

function triggerWin(resultNum) {
    gameState = "WIN";
    const menuInfo = getMenuByNumber(resultNum);
    
    // 豪華ポップアップ表示
    document.getElementById('menu-card-num').innerText = `当選番号：【 ${resultNum} 】（グループ: ${menuInfo.range}）`;
    document.getElementById('menu-card-name').innerText = menuInfo.name;
    document.getElementById('menu-card-overlay').classList.add('show');
    
    particleMaterial.opacity = 1;
}

function closeOverlay() {
    document.getElementById('menu-card-overlay').classList.remove('show');
    const btn = document.getElementById('action-btn');
    btn.innerText = "START";
    btn.classList.remove('stop-mode');
    btn.disabled = false;
    
    particleMaterial.opacity = 0;
    gameState = "READY";
    wheelSpeed = 0.01; // 初期状態の低速回転に戻す
}

// --- メインループ ---
function animate() {
    requestAnimationFrame(animate);

    // 1. 盤面（ホイール）は常に回り続ける
    wheelGroup.rotation.y += wheelSpeed;

    if (gameState === "SPINNING") {
        ballAngle += ballSpeed;
        updateBallPosition();
    } 
    else if (gameState === "STOPPING") {
        ballAngle += ballSpeed;
        ballSpeed *= 0.985;        // 球がじわじわ減速
        wheelSpeed *= 0.99;        // 盤面もじわじわ減速
        ballOrbitRadius -= 0.003;  // 球が徐々に内側の溝へ落ちていく

        updateBallPosition();

        // 完全に低速になったら、落ちる溝（数字）を決定
        if (Math.abs(ballSpeed) < 0.015) {
            gameState = "BALL_DROP";
            
            let currentWheelAngle = wheelGroup.rotation.y % (Math.PI * 2);
            if (currentWheelAngle < 0) currentWheelAngle += Math.PI * 2;
            
            const segmentAngle = (Math.PI * 2) / totalSegments;
            // 落ちる位置のインデックスを計算
            targetNumberIndex = Math.floor(((Math.PI * 2 - currentWheelAngle) + segmentAngle / 2) / segmentAngle) % totalSegments;
            
            // 球の位置をその溝の位置に同期させる
            ballAngle = (Math.PI * 2) - (targetNumberIndex * segmentAngle) - currentWheelAngle;
            ballOrbitRadius = wheelRadius - 0.4; // 内側の溝の半径
        }
    }
    else if (gameState === "BALL_DROP") {
        // 決定した数字の溝に吸い込まれる演出
        let currentWheelAngle = wheelGroup.rotation.y % (Math.PI * 2);
        const segmentAngle = (Math.PI * 2) / totalSegments;
        ballAngle = (Math.PI * 2) - (targetNumberIndex * segmentAngle) - currentWheelAngle;
        
        const targetCos = Math.cos(ballAngle) * (wheelRadius - 0.4);
        const targetSin = Math.sin(ballAngle) * (wheelRadius - 0.4);
        const targetPos = new THREE.Vector3(targetCos, 0.1, targetSin);
        targetPos.applyAxisAngle(new THREE.Vector3(1, 0, 0), 0.3);
        
        ballMesh.position.lerp(targetPos, 0.2);
        
        if (ballMesh.position.distanceTo(targetPos) < 0.02) {
            triggerWin(wheelNumbers[targetNumberIndex]);
        }
    }
    else if (gameState === "WIN") {
        // 当選後、盤面と一緒に球も回転し続ける
        let currentWheelAngle = wheelGroup.rotation.y % (Math.PI * 2);
        const segmentAngle = (Math.PI * 2) / totalSegments;
        ballAngle = (Math.PI * 2) - (targetNumberIndex * segmentAngle) - currentWheelAngle;
        updateBallPosition();

        // 紙吹雪を降らせる
        const positions = particleSystem.geometry.attributes.position.array;
        for (let i = 0; i < particleCount; i++) {
            positions[i * 3 + 1] += particleVelocities[i].y;
            if (positions[i * 3 + 1] < -1) positions[i * 3 + 1] = 3;
        }
        particleSystem.geometry.attributes.position.needsUpdate = true;
    }

    renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
    renderer.setSize(container.clientWidth, container.clientHeight);
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
});
</script>
</body>
</html>
