<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>今宵の運試し</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #0b1326;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        
        /* ゲーム画面全体 */
        #game-container {
            position: relative;
            width: 100%;
            max-width: 450px;
            height: 100vh;
            background: url('background.png') no-repeat center center;
            background-size: cover;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            overflow: hidden;
        }

        /* 筒とフクロウのタップエリア（実機サイズに最適化） */
        #cylinder-container {
            position: absolute;
            top: 20%;   
            left: 28%;  
            width: 44%; 
            height: 45%;
            z-index: 10;
            cursor: pointer;
        }

        /* 筒とフクロウが揺れるアニメーション */
        .shake-cylinder {
            animation: cylinderShake 0.08s infinite alternate;
        }
        @keyframes cylinderShake {
            0% { transform: translate(-4px, -2px) rotate(-1.5deg); }
            100% { transform: translate(4px, 2px) rotate(1.5deg); }
        }

        /* おみくじパワーゲージ（空の溝の上に、純粋な光のバーをぴったり重ねます） */
        #gauge-wrapper {
            position: absolute;
            bottom: 4.8%; 
            left: 24.5%;
            width: 51%;
            height: 3.5%;
            z-index: 5;
            border-radius: 10px;
            overflow: hidden;
            pointer-events: none;
        }
        .gauge-fill {
            width: 0%; /* 最初は0%（空っぽからスタート） */
            height: 100%;
            background: linear-gradient(90deg, #ffea00, #ff6600, #ff0055);
            box-shadow: 0 0 15px #ffcc00;
            transition: width 0.06s ease-out;
        }

        /* 煙のドロンッ演出エフェクト */
        #smoke-effect {
            position: absolute;
            top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0);
            width: 350px; height: 350px;
            background: radial-gradient(circle, rgba(255,255,255,0.95) 0%, rgba(220,220,220,0.7) 50%, rgba(255,255,255,0) 75%);
            border-radius: 50%;
            z-index: 50;
            pointer-events: none;
            opacity: 0;
        }
        .smoke-burst {
            animation: smokeAnim 0.5s ease-out forwards;
        }
        @keyframes smokeAnim {
            0% { transform: translate(-50%, -50%) scale(0.1); opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 0.8; }
            100% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; }
        }

        /* 結果ポップアップ */
        #result-modal {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(8, 13, 26, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .modal-content {
            background: #fffdf9;
            color: #333;
            width: 85%;
            padding: 35px 20px;
            border-radius: 24px;
            text-align: center;
            border: 4px solid #e6b422;
            box-shadow: 0 10px 35px rgba(0,0,0,0.6);
            transform: scale(0.5);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .fortune-title {
            font-size: 3.2rem;
            font-weight: bold;
            color: #d93333;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }
        .fortune-comment {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #444;
            margin-bottom: 30px;
            font-weight: bold;
            background: #fdf5e6;
            padding: 18px 12px;
            border-radius: 14px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
        }
        .restart-btn {
            background: linear-gradient(135deg, #e6b422, #b8860b);
            color: #fff;
            border: none;
            padding: 15px 45px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(230,180,34,0.3);
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="cylinder-container"></div>

    <div id="gauge-wrapper">
        <div class="gauge-fill" id="gauge-fill"></div>
    </div>

    <div id="smoke-effect"></div>

    <div id="result-modal">
        <div class="modal-content" id="modal-content">
            <div class="fortune-title" id="fortune-title">大吉!!</div>
            <div class="fortune-comment" id="fortune-comment">コメント</div>
            <button class="restart-btn" onclick="resetGame()">もう一度占う</button>
        </div>
    </div>
</div>

<script>
    const cylinderContainer = document.getElementById('cylinder-container');
    const gaugeFill = document.getElementById('gauge-fill');
    const smokeEffect = document.getElementById('smoke-effect');
    const resultModal = document.getElementById('result-modal');
    const modalContent = document.getElementById('modal-content');
    const fortuneTitle = document.getElementById('fortune-title');
    const fortuneComment = document.getElementById('fortune-comment');

    let power = 0;
    let isFinished = false;
    let decayTimer;

    const fortunes = [
        { title: "超大吉🎉", comment: "運気MAX！今日食べる『焼き餃子』と『肉豆腐』は、間違いなく人生で一番美味しいと感じるでしょう！" },
        { title: "大吉🌟", comment: "熱々の『焼き餃子』をタレにつけるその瞬間、探していた最高のアイデアがパッと閃く予感！" },
        { title: "大吉🌟", comment: "『串カツ』に特製ソースがたっぷり絡むように、素晴らしいご縁が次々とあなたに絡みついてきます！" },
        { title: "吉✨", comment: "『肉豆腐』の出汁がじっくり染み渡るように、あなたの優しさが周囲の人の心にしみわたる素晴らしい一日。" },
        { title: "吉✨", comment: "『焼き餃子』を近くの人に1個シェアしてみて。それだけで対人運が今の2倍に跳ね上がります！" },
        { title: "中吉👍", comment: "今日なら『串カツ』のサクサクの衣を一口もこぼさずに食べられる、驚異の集中力が備わっています。" },
        { title: "中吉👍", comment: "『肉豆腐』のスープを一口飲むごとに、今週溜まった疲れがじわ〜っと癒されて消えていくでしょう。" },
        { title: "小吉😊", comment: "目の前の『焼き餃子』の焼き目が完璧な黄金色だったら、このあと小さくて嬉しいラッキーが起こります！" },
        { title: "小吉😊", comment: "『串カツ』の注文タイミングが神がかる予感。揚げたてアツアツの一番旨い瞬間を逃すな！" },
        { title: "末吉🍀", comment: "『肉豆腐』のネギをよーく見てみて！もしかしたらハート型に見えるネギが紛れ込んでいるかも…？" }
    ];

    // 連打タップイベント
    cylinderContainer.addEventListener('pointerdown', (e) => {
        if (isFinished) return;
        e.preventDefault();

        // 筒とフクロウを揺らす
        cylinderContainer.classList.add('shake-cylinder');

        // パワーを12%ずつプラス
        power += 12;
        if (power > 100) power = 100;
        
        // 0%から純粋に右へ伸びていくバー
        gaugeFill.style.width = power + '%';

        if (power >= 100) {
            triggerSmokeAndResult();
        }
    });

    cylinderContainer.addEventListener('pointerup', () => cylinderContainer.classList.remove('shake-cylinder'));
    cylinderContainer.addEventListener('pointerleave', () => cylinderContainer.classList.remove('shake-cylinder'));

    // 自動減少処理（サボるとゲージが左へ縮む）
    decayTimer = setInterval(() => {
        if (isFinished || power <= 0) return;
        power -= 4;
        if (power < 0) power = 0;
        gaugeFill.style.width = power + '%';
    }, 150);

    // 煙ドロン演出
    function triggerSmokeAndResult() {
        isFinished = true;
        cylinderContainer.classList.remove('shake-cylinder');

        const result = fortunes[Math.floor(Math.random() * fortunes.length)];
        fortuneTitle.innerText = result.title;
        fortuneComment.innerText = result.comment;

        smokeEffect.classList.add('smoke-burst');

        setTimeout(() => {
            resultModal.style.display = 'flex';
            setTimeout(() => {
                resultModal.style.opacity = '1';
                modalContent.style.transform = 'scale(1)';
            }, 50);
        }, 250);
    }

    function resetGame() {
        power = 0;
        isFinished = false;
        gaugeFill.style.width = '0%';
        resultModal.style.opacity = '0';
        modalContent.style.transform = 'scale(0.5)';
        smokeEffect.classList.remove('smoke-burst');
        
        setTimeout(() => {
            resultModal.style.display = 'none';
        }, 400);
    }
</script>
</body>
</html>
