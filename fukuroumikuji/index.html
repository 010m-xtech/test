<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>今宵の運試し</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #0b1326;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        
        /* ゲーム画面全体（決定したイラストデータをプログラム内に直接埋め込みました） */
        #game-container {
            position: relative;
            width: 100%;
            max-width: 450px;
            height: 100vh;
            /* リンク切れを起こさないデータ埋め込み方式に変更 */
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 800" width="100%" height="100%"><rect width="450" height="800" fill="%230b1326"/><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0%25" stop-color="%23111a36"/><stop offset="40%25" stop-color="%232d3e6b"/><stop offset="70%25" stop-color="%23191426"/></linearGradient><rect width="450" height="800" fill="url(%23g)"/><polygon points="225,120 370,230 340,230 390,340 360,340 420,480 30,480 90,340 60,340 110,230 80,230" fill="rgba(255,255,255,0.04)" stroke="rgba(212,175,55,0.2)" stroke-width="2"/><circle cx="80" cy="180" r="16" fill="%23ff4d4d" filter="blur(2px)"/><circle cx="160" cy="140" r="14" fill="%23ff4d4d" filter="blur(2px)"/><circle cx="290" cy="140" r="14" fill="%23ff4d4d" filter="blur(2px)"/><circle cx="370" cy="180" r="16" fill="%23ff4d4d" filter="blur(2px)"/><path d="M120 180 L80 240 M330 180 L370 240" stroke="%23ff4d4d" stroke-width="3"/><path d="M0 450 Q 110 520 225 460 T 450 480" fill="none" stroke="%23ff8800" stroke-width="2" stroke-dasharray="5,5"/><path d="M30 480 L140 480 L140 700 L30 700 Z" fill="%23cc3333" opacity="0.8"/><path d="M310 480 L420 480 L420 700 L310 700 Z" fill="%23cc3333" opacity="0.8"/><text x="50" y="540" fill="%23fff" font-size="28" font-weight="bold" writing-mode="tb">夏祭り</text><text x="350" y="540" fill="%23fff" font-size="24" font-weight="bold" writing-mode="tb">おみくじ</text><path d="M110 480 Q 160 450 225 480 T 340 460" fill="none" stroke="%23fff" opacity="0.15" stroke-width="40"/><circle cx="110" cy="420" r="14" fill="%23ffaa00"/><circle cx="170" cy="440" r="12" fill="%23ffaa00"/><circle cx="280" cy="440" r="12" fill="%23ffaa00"/><circle cx="340" cy="420" r="14" fill="%23ffaa00"/><text x="225" y="76" fill="%23e6b422" font-size="36" font-weight="bold" text-anchor="middle" font-family="sans-serif">今宵の運試し</text><g transform="translate(145,280)"><rect width="160" height="280" rx="20" fill="linear-gradient(135deg, %238a5a36, %235c3a21)" stroke="%23d4af37" stroke-width="5"/><rect x="15" y="20" width="130" height="240" rx="10" fill="none" stroke="%23ffaa00" stroke-width="2" stroke-dasharray="10,5"/><rect x="52" y="70" width="56" height="140" rx="8" fill="%23fff"/><text x="80" y="115" fill="%23000" font-size="32" font-weight="bold" text-anchor="middle">振</text><text x="80" y="155" fill="%23000" font-size="32" font-weight="bold" text-anchor="middle">っ</text><text x="80" y="195" fill="%23000" font-size="32" font-weight="bold" text-anchor="middle">て</text><text x="80" y="235" fill="%23000" font-size="32" font-weight="bold" text-anchor="middle">ね</text></g><g transform="translate(190,210)"><circle cx="35" cy="35" r="35" fill="%23222" stroke="%23fff" stroke-width="3"/><ellipse cx="20" cy="30" rx="11" ry="7" fill="%23fff"/><ellipse cx="50" cy="30" rx="11" ry="7" fill="%23fff"/><circle cx="20" cy="32" r="5" fill="%23000"/><circle cx="50" cy="32" r="5" fill="%23000"/><ellipse cx="10" cy="38" rx="5" ry="3" fill="%23ff3333"/><ellipse cx="60" cy="38" rx="5" ry="3" fill="%23ff3333"/><polygon points="35,38 31,46 39,46" fill="%23ffaa00"/><path d="M10 45 Q -10 60 5 65 Q 15 55 20 48" fill="%23222"/><path d="M25 60 Q 35 68 45 60" fill="none" stroke="%23fff" stroke-width="3"/></g><path d="M110 740 H 340" stroke="%233a2312" stroke-width="24" stroke-linecap="round"/><text x="225" y="715" fill="%23bbb" font-size="16" text-anchor="middle">おみくじパワー</text></svg>') no-repeat center center;
            background-size: cover;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            overflow: hidden;
        }

        /* 画面連打用の全画面タップゾーン（どこを叩いても反応するように改善） */
        #tap-zone {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            cursor: pointer;
            z-index: 10;
        }

        /* タップ時にゲーム画面全体がガタガタ揺れる演出 */
        .shake-bg {
            animation: shakeAnim 0.08s infinite alternate;
        }
        @keyframes shakeAnim {
            0% { transform: translate(-3px, -2px) rotate(-0.5deg); }
            100% { transform: translate(3px, 2px) rotate(0.5deg); }
        }

        /* パワーゲージ（画面最下部のゲージ溝にぴったり重なるように調整） */
        #gauge-wrapper {
            position: absolute;
            bottom: 7.2%; 
            left: 25%;
            width: 50%;
            height: 2%;
            z-index: 15;
            border-radius: 10px;
            overflow: hidden;
            pointer-events: none;
        }
        .gauge-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ffea00, #ff6600, #ff0055);
            box-shadow: 0 0 15px #ffcc00;
            transition: width 0.06s ease-out;
        }

        /* 煙のドロンッ演出エフェクト */
        #smoke-effect {
            position: absolute;
            top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0);
            width: 350px; height: 350px;
            background: radial-gradient(circle, rgba(255,255,255,0.95) 0%, rgba(220,220,220,0.7) 50%, rgba(255,255,255,0) 75%);
            border-radius: 50%;
            z-index: 50;
            pointer-events: none;
            opacity: 0;
        }
        .smoke-burst {
            animation: smokeAnim 0.5s ease-out forwards;
        }
        @keyframes smokeAnim {
            0% { transform: translate(-50%, -50%) scale(0.1); opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 0.8; }
            100% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; }
        }

        /* 結果ポップアップ */
        #result-modal {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(8, 13, 26, 0.75);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .modal-content {
            background: #fffdf9;
            color: #333;
            width: 85%;
            padding: 35px 20px;
            border-radius: 24px;
            text-align: center;
            border: 4px solid #e6b422;
            box-shadow: 0 10px 35px rgba(0,0,0,0.6);
            transform: scale(0.5);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .fortune-title {
            font-size: 3.2rem;
            font-weight: bold;
            color: #d93333;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }
        .fortune-comment {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #444;
            margin-bottom: 30px;
            font-weight: bold;
            background: #fdf5e6;
            padding: 18px 12px;
            border-radius: 14px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
        }
        .restart-btn {
            background: linear-gradient(135deg, #e6b422, #b8860b);
            color: #fff;
            border: none;
            padding: 15px 45px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(230,180,34,0.3);
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="tap-zone"></div>

    <div id="gauge-wrapper">
        <div class="gauge-fill" id="gauge-fill"></div>
    </div>

    <div id="smoke-effect"></div>

    <div id="result-modal">
        <div class="modal-content" id="modal-content">
            <div class="fortune-title" id="fortune-title">大吉!!</div>
            <div class="fortune-comment" id="fortune-comment">コメント</div>
            <button class="restart-btn" onclick="resetGame()">もう一度占う</button>
        </div>
    </div>
</div>

<script>
    const gameContainer = document.getElementById('game-container');
    const tapZone = document.getElementById('tap-zone');
    const gaugeFill = document.getElementById('gauge-fill');
    const smokeEffect = document.getElementById('smoke-effect');
    const resultModal = document.getElementById('result-modal');
    const modalContent = document.getElementById('modal-content');
    const fortuneTitle = document.getElementById('fortune-title');
    const fortuneComment = document.getElementById('fortune-comment');

    let power = 0;
    let isFinished = false;
    let decayTimer;

    const fortunes = [
        { title: "超大吉🎉", comment: "運気MAX！今日食べる『焼き餃子』と『肉豆腐』は、間違いなく人生で一番美味しいと感じるでしょう！" },
        { title: "大吉🌟", comment: "熱々の『焼き餃子』をタレにつけるその瞬間、探していた最高のアイデアがパッと閃く予感！" },
        { title: "大吉🌟", comment: "『串カツ』に特製ソースがたっぷり絡むように、素晴らしいご縁が次々とあなたに絡みついてきます！" },
        { title: "吉✨", comment: "『肉豆腐』の出汁がじっくり染み渡るように、あなたの優しさが周囲の人の心にしみわたる素晴らしい一日。" },
        { title: "吉✨", comment: "『焼き餃子』を近くの人に1個シェアしてみて。それだけで対人運が今の2倍に跳ね上がります！" },
        { title: "中吉👍", comment: "今日なら『串カツ』のサクサクの衣を一口もこぼさずに食べられる、驚異の集中力が備わっています。" },
        { title: "中吉👍", comment: "『肉豆腐』のスープを一口飲むごとに、今週溜まった疲れがじわ〜っと癒されて消えていくでしょう。" },
        { title: "小吉😊", comment: "目の前の『焼き餃子』の焼き目が完璧な黄金色だったら、このあと小さくて嬉しいラッキーが起こります！" },
        { title: "小吉😊", comment: "『串カツ』の注文タイミングが神がかる予感。揚げたてアツアツの一番旨い瞬間を逃すな！" },
        { title: "末吉🍀", comment: "『肉豆腐』のネギをよーく見てみて！もしかしたらハート型に見えるネギが紛れ込んでいるかも…？" }
    ];

    // 連打タップイベント
    tapZone.addEventListener('pointerdown', (e) => {
        if (isFinished) return;
        e.preventDefault();

        gameContainer.classList.add('shake-bg');

        // パワー充填（1タップあたり12%アップ）
        power += 12;
        if (power > 100) power = 100;
        gaugeFill.style.width = power + '%';

        if (power >= 100) {
            triggerSmokeAndResult();
        }
    });

    tapZone.addEventListener('pointerup', () => gameContainer.classList.remove('shake-bg'));
    tapZone.addEventListener('pointerleave', () => gameContainer.classList.remove('shake-bg'));

    // 放置すると少しずつゲージが減る（連打を促す仕様）
    decayTimer = setInterval(() => {
        if (isFinished || power <= 0) return;
        power -= 4;
        if (power < 0) power = 0;
        gaugeFill.style.width = power + '%';
    }, 150);

    // 煙ドロン！演出
    function triggerSmokeAndResult() {
        isFinished = true;
        gameContainer.classList.remove('shake-bg');

        const result = fortunes[Math.floor(Math.random() * fortunes.length)];
        fortuneTitle.innerText = result.title;
        fortuneComment.innerText = result.comment;

        smokeEffect.classList.add('smoke-burst');

        setTimeout(() => {
            resultModal.style.display = 'flex';
            setTimeout(() => {
                resultModal.style.opacity = '1';
                modalContent.style.transform = 'scale(1)';
            }, 50);
        }, 250);
    }

    function resetGame() {
        power = 0;
        isFinished = false;
        gaugeFill.style.width = '0%';
        resultModal.style.opacity = '0';
        modalContent.style.transform = 'scale(0.5)';
        smokeEffect.classList.remove('smoke-burst');
        
        setTimeout(() => {
            resultModal.style.display = 'none';
        }, 400);
    }
</script>
</body>
</html>
