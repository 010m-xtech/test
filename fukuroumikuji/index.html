<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>今宵の運試し</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #0b1326;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        
        /* ゲーム画面全体（決定したイラストデザインを背景に設定） */
        #game-container {
            position: relative;
            width: 100%;
            max-width: 450px;
            height: 100vh;
            /* AIが生成した理想のゲーム背景画像を直接読み込み */
            background: url('https://images.imagesverse.space/image_generation_content/8.png') no-repeat center center;
            background-size: cover;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            overflow: hidden;
        }

        /* 透明なタップ判定エリア（イラストのおみくじの筒がある位置にぴったり重ねる） */
        #tap-zone {
            position: absolute;
            top: 20%;
            left: 38%;
            width: 25%;
            height: 40%;
            cursor: pointer;
            z-index: 10;
            /* 開発時は視覚的に分かりやすくするため、ほんのり透明な赤にしてあります */
            /* 完成して非表示にしたい場合は、下の line の最初にある「//」を消してください */
            /* background: rgba(255, 0, 0, 0.2); */
        }

        /* 画面が連打されたときに背景全体がガタガタ揺れる演出用クラス */
        .shake-bg {
            animation: shakeAnim 0.1s infinite alternate;
        }
        @keyframes shakeAnim {
            0% { transform: translate(-2px, -1px) rotate(-0.5deg); }
            100% { transform: translate(2px, 1px) rotate(0.5deg); }
        }

        /* おみくじパワーゲージ（画面最下部のパーツにジャストフィット） */
        #gauge-wrapper {
            position: absolute;
            bottom: 4.8%; 
            left: 24.5%;
            width: 51%;
            height: 3.5%;
            z-index: 5;
            border-radius: 10px;
            overflow: hidden;
            pointer-events: none;
        }
        .gauge-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ffcc00, #ff6600, #ffea00);
            box-shadow: 0 0 15px #ffcc00;
            transition: width 0.08s ease-out;
        }

        /* 煙の演出エフェクト（中央からモクモクと広がる） */
        #smoke-effect {
            position: absolute;
            top: 40%; left: 50%; transform: translate(-50%, -50%) scale(0);
            width: 300px; height: 300px;
            background: radial-gradient(circle, rgba(240,240,240,0.9) 0%, rgba(200,200,200,0.6) 40%, rgba(255,255,255,0) 70%);
            border-radius: 50%;
            z-index: 50;
            pointer-events: none;
            opacity: 0;
        }
        .smoke-burst {
            animation: smokeAnim 0.6s ease-out forwards;
        }
        @keyframes smokeAnim {
            0% { transform: translate(-50%, -50%) scale(0.2); opacity: 0; }
            30% { opacity: 1; }
            80% { opacity: 0.8; }
            100% { transform: translate(-50%, -50%) scale(1.6); opacity: 0; }
        }

        /* 結果画面ポップアップ（煙の後にドロンと登場） */
        #result-modal {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .modal-content {
            background: #fff8ed;
            color: #333;
            width: 85%;
            padding: 35px 20px;
            border-radius: 24px;
            text-align: center;
            border: 4px solid #e6b422;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            transform: scale(0.6);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .fortune-title {
            font-size: 3rem;
            font-weight: bold;
            color: #d93333;
            margin-bottom: 15px;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.1);
        }
        .fortune-comment {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #444;
            margin-bottom: 30px;
            font-weight: bold;
            background: rgba(255,255,255,0.8);
            padding: 15px;
            border-radius: 12px;
            box-shadow: inset 0 0 8px rgba(0,0,0,0.05);
        }
        .restart-btn {
            background: linear-gradient(135deg, #e6b422, #c59512);
            color: #fff;
            border: none;
            padding: 14px 40px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(230,180,34,0.4);
            transition: transform 0.1s;
        }
        .restart-btn:active { transform: scale(0.95); }
    </style>
</head>
<body>

<div id="game-container">
    <div id="tap-zone"></div>

    <div id="gauge-wrapper">
        <div class="gauge-fill" id="gauge-fill"></div>
    </div>

    <div id="smoke-effect"></div>

    <div id="result-modal">
        <div class="modal-content" id="modal-content">
            <div class="fortune-title" id="fortune-title">大吉!!</div>
            <div class="fortune-comment" id="fortune-comment">コメント</div>
            <button class="restart-btn" onclick="resetGame()">もう一度占う</button>
        </div>
    </div>
</div>

<script>
    const gameContainer = document.getElementById('game-container');
    const tapZone = document.getElementById('tap-zone');
    const gaugeFill = document.getElementById('gauge-fill');
    const smokeEffect = document.getElementById('smoke-effect');
    const resultModal = document.getElementById('result-modal');
    const modalContent = document.getElementById('modal-content');
    const fortuneTitle = document.getElementById('fortune-title');
    const fortuneComment = document.getElementById('fortune-comment');

    let power = 0;
    let isFinished = false;
    let decayTimer;

    // お任せいただいた、お店のメニュー（焼き餃子・肉豆腐・串カツ）を交えた面白おみくじコメント
    const fortunes = [
        { title: "超大吉🎉", comment: "運気MAX！今日食べる『焼き餃子』と『肉豆腐』は、間違いなく人生で一番美味しいと感じるでしょう！" },
        { title: "大吉🌟", comment: "熱々の『焼き餃子』をタレにつけるその瞬間、探していた最高のアイデアがパッと閃く予感！" },
        { title: "大吉🌟", comment: "『串カツ』に特製ソースがたっぷり絡むように、素晴らしいご縁が次々とあなたに絡みついてきます！" },
        { title: "吉✨", comment: "『肉豆腐』の出汁がじっくり染み渡るように、あなたの優しさが周囲の人の心にしみわたる素晴らしい一日。" },
        { title: "吉✨", comment: "『焼き餃子』を近くの人に1個シェアしてみて。それだけで対人運が今の2倍に跳ね上がります！" },
        { title: "中吉👍", comment: "今日なら『串カツ』のサクサクの衣を一口もこぼさずに食べられる、驚異の集中力が備わっています。" },
        { title: "中吉👍", comment: "『肉豆腐』のスープを一口飲むごとに、今週溜まった疲れがじわ〜っと癒されて消えていくでしょう。" },
        { title: "小吉😊", comment: "目の前の『焼き餃子』の焼き目が完璧な黄金色だったら、このあと小さくて嬉しいラッキーが起こります！" },
        { title: "小吉😊", comment: "『串カツ』の追加注文のタイミングが神がかる予感。揚げたてアツアツの一番旨い瞬間を逃すな！" },
        { title: "末吉🍀", comment: "『肉豆腐』のネギをよーく見てみて！もしかしたらハート型に見えるネギが紛れ込んでいるかも…？" }
    ];

    // タップ（連打）イベント
    tapZone.addEventListener('pointerdown', (e) => {
        if (isFinished) return;
        e.preventDefault();

        // 連打している間、画面全体（筒）をガタガタ揺らす
        gameContainer.classList.add('shake-bg');

        // パワーをためる（1タップあたり12%上昇）
        power += 12;
        if (power > 100) power = 100;
        gaugeFill.style.width = power + '%';

        // ゲージ満タンで演出開始
        if (power >= 100) {
            triggerSmokeAndResult();
        }
    });

    // 指を離したら揺れを止める
    tapZone.addEventListener('pointerup', () => {
        gameContainer.classList.remove('shake-bg');
    });
    tapZone.addEventListener('pointerleave', () => {
        gameContainer.classList.remove('shake-bg');
    });

    // 自動減少システム（連打をサボると3%ずつおみくじパワーが減っていく）
    decayTimer = setInterval(() => {
        if (isFinished || power <= 0) return;
        power -= 3;
        if (power < 0) power = 0;
        gaugeFill.style.width = power + '%';
    }, 150);

    // 煙エフェクトの発生とおみくじ結果表示
    function triggerSmokeAndResult() {
        isFinished = true;
        gameContainer.classList.remove('shake-bg');

        // ランダムで運勢を決定
        const result = fortunes[Math.floor(Math.random() * fortunes.length)];
        fortuneTitle.innerText = result.title;
        fortuneComment.innerText = result.comment;

        // 1. 煙がモクモクと広がる演出
        smokeEffect.classList.add('smoke-burst');

        // 2. 煙が広がった一瞬のタイミング（0.3秒後）でドロンと結果画面を表示
        setTimeout(() => {
            resultModal.style.display = 'flex';
            setTimeout(() => {
                resultModal.style.opacity = '1';
                modalContent.style.transform = 'scale(1)';
            }, 50);
        }, 300);
    }

    // ゲームのリセット（もう一度引く）
    function resetGame() {
        power = 0;
        isFinished = false;
        gaugeFill.style.width = '0%';
        resultModal.style.opacity = '0';
        modalContent.style.transform = 'scale(0.6)';
        smokeEffect.classList.remove('smoke-burst');
        
        setTimeout(() => {
            resultModal.style.display = 'none';
        }, 400);
    }
</script>
</body>
</html>
