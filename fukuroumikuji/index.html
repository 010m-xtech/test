<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>今宵の運試しくじ</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #0b1326;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        
        /* ゲーム画面全体（背景画像を表示） */
        #game-container {
            position: relative;
            width: 100%;
            max-width: 450px;
            height: 100vh;
            background: url('background.png') no-repeat center center;
            background-size: cover;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            overflow: hidden;
        }

        /* 画面全体を覆うタップ感知レイヤー */
        #tap-zone {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            cursor: pointer;
            z-index: 20;
        }

        /* 連打された時に画面全体（背景のふくろうごと）を激しく揺らすアニメーション */
        .shake-active {
            animation: globalShake 0.08s infinite alternate;
        }
        @keyframes globalShake {
            0% { transform: translate(-5px, -3px) rotate(-0.5deg); }
            100% { transform: translate(5px, 3px) rotate(0.5deg); }
        }

        /* お祭り風パワーゲージ（0%から綺麗に増えていく） */
        #gauge-wrapper {
            position: absolute;
            bottom: 4.8%;
            left: 5%;
            width: 90%;
            height: 4.5%;
            z-index: 10;
            background: rgba(11, 19, 38, 0.85); 
            border: 3px solid #ffaa00; 
            border-radius: 18px;
            padding: 2px 4px;    
            overflow: hidden;
            pointer-events: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .gauge-fill {
            width: 0%; 
            height: 100%;
            background: linear-gradient(90deg, #ffcc00, #ff3300);
            border-radius: 12px;
            box-shadow: 0 0 15px #ffaa00;
            transition: width 0.08s ease-out;
        }

        /* 演出エフェクト */
        #smoke-effect {
            position: absolute;
            top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0);
            width: 350px; height: 350px;
            background: radial-gradient(circle, rgba(255,255,255,0.95) 0%, rgba(255,170,0,0.5) 50%, rgba(255,255,255,0) 75%);
            border-radius: 50%;
            z-index: 50;
            pointer-events: none;
            opacity: 0;
        }
        .smoke-burst {
            animation: smokeAnim 0.5s ease-out forwards;
        }
        @keyframes smokeAnim {
            0% { transform: translate(-50%, -50%) scale(0.1); opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 0.8; }
            100% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; }
        }

        /* 結果ポップアップ（お祭り・夜店風） */
        #result-modal {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 19, 38, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .modal-content {
            background: #fffdf9;
            color: #333;
            width: 85%;
            padding: 30px 20px;
            border-radius: 24px;
            text-align: center;
            border: 4px solid #ff9900;
            box-shadow: 0 10px 35px rgba(0,0,0,0.6);
            transform: scale(0.5);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .fortune-title {
            font-size: 3.2rem;
            font-weight: bold;
            color: #ff3300;
            margin-bottom: 12px;
            letter-spacing: 2px;
        }
        .fortune-comment {
            font-size: 1.05rem;
            line-height: 1.5;
            color: #222;
            margin-bottom: 15px;
            font-weight: bold;
            background: #fff4e6;
            padding: 14px 12px;
            border-radius: 14px;
        }
        
        /* ラッキーアイテム用スタイリング（ちょうちんカラー） */
        .lucky-item-box {
            background: linear-gradient(135deg, #fffaf0, #ffebcd);
            border: 2px dashed #ff9900;
            padding: 12px;
            border-radius: 14px;
            margin-bottom: 25px;
            font-weight: bold;
            color: #333;
            font-size: 1.05rem;
        }
        .lucky-item-name {
            color: #e65c00;
            font-size: 1.25rem;
            display: block;
            margin-top: 4px;
            text-shadow: 1px 1px 0px #fff;
        }

        .restart-btn {
            background: linear-gradient(135deg, #ff9900, #ff5500);
            color: #fff;
            border: none;
            padding: 15px 45px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255,153,0,0.3);
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="tap-zone"></div>

    <div id="gauge-wrapper">
        <div class="gauge-fill" id="gauge-fill"></div>
    </div>

    <div id="smoke-effect"></div>

    <div id="result-modal">
        <div class="modal-content" id="modal-content">
            <div class="fortune-title" id="fortune-title">超大吉🏮</div>
            <div class="fortune-comment" id="fortune-comment">コメント</div>
            
            <div class="lucky-item-box">
                🏮 今宵のラッキーメニュー 🏮
                <span class="lucky-item-name" id="lucky-item-name">焼き餃子</span>
            </div>

            <button class="restart-btn" onclick="resetGame()">もう一度占う</button>
        </div>
    </div>
</div>

<script>
    const gameContainer = document.getElementById('game-container');
    const tapZone = document.getElementById('tap-zone');
    const gaugeFill = document.getElementById('gauge-fill');
    const smokeEffect = document.getElementById('smoke-effect');
    const resultModal = document.getElementById('result-modal');
    const modalContent = document.getElementById('modal-content');
    const fortuneTitle = document.getElementById('fortune-title');
    const fortuneComment = document.getElementById('fortune-comment');
    const luckyItemName = document.getElementById('lucky-item-name');

    let power = 0;
    let isFinished = false;

    const fortunes = [
        { title: "超大吉🏮", comment: "最高にツイてる夜！今夜は思いっきり笑って過ごすと、さらに運気が爆発します！" },
        { title: "大吉🌟", comment: "笑顔がこぼれる素敵な時間になりそう。大切な人と会話が弾んで絆が深まる予感！" },
        { title: "大吉🌟", comment: "素晴らしい引きの強さを持っています。気になっていたことに挑戦するなら今日がベスト！" },
        { title: "吉✨", comment: "心がホッとする嬉しい出来事がありそう。いつも通りの選択が大きなハッピーに繋がります。" },
        { title: "吉✨", comment: "お腹も心も満たされる大満足なひとときに。日頃の疲れが綺麗に吹き飛んでいきます！" },
        { title: "中吉🎉", comment: "楽しいおしゃべりが最大のパワーの源！周りの人と楽しい時間を共有してみて。" },
        { title: "中吉🎉", comment: "直感が冴え渡る時。ふと思ついいたアイデアや、食べたいと思ったものが大正解！" },
        { title: "小吉👍", comment: "ちょっとした美味しいご褒美が吉。自分のペースを大切にすると、充実した時間になります。" },
        { title: "末吉🍀", comment: "周りをゆっくり見渡してみて。あなたのすぐ近くに、小さくて心がほっこりするラッキーが隠れています。" }
    ];

    const luckyItems = [
        "焼き餃子 🥟",
        "肉豆腐 🪵",
        "みそ串カツ 🍢",
        "スパイス玉子 🥚",
        "こぼれ麻婆豆腐 🌶️",
        "生レバーのジュワッと焼き 🥩",
        "ウズラ串 🍢",
        "海鮮プチぜいたく盛り 🐟"
    ];

    // 連打タップイベント
    tapZone.addEventListener('pointerdown', (e) => {
        if (isFinished) return;
        e.preventDefault();

        // 画面全体（背景のふくろうイラストごと）をガタガタ揺らす
        gameContainer.classList.add('shake-active');

        power += 11;
        if (power > 100) power = 100;
        
        gaugeFill.style.width = power + '%';

        if (power >= 100) {
            triggerSmokeAndResult();
        }
    });

    tapZone.addEventListener('pointerup', () => gameContainer.classList.remove('shake-active'));
    tapZone.addEventListener('pointerleave', () => gameContainer.classList.remove('shake-active'));

    function triggerSmokeAndResult() {
        isFinished = true;
        gameContainer.classList.remove('shake-active');

        const result = fortunes[Math.floor(Math.random() * fortunes.length)];
        fortuneTitle.innerText = result.title;
        fortuneComment.innerText = result.comment;

        const randomItem = luckyItems[Math.floor(Math.random() * luckyItems.length)];
        luckyItemName.innerText = randomItem;

        smokeEffect.classList.add('smoke-burst');

        setTimeout(() => {
            resultModal.style.display = 'flex';
            setTimeout(() => {
                resultModal.style.opacity = '1';
                modalContent.style.transform = 'scale(1)';
            }, 50);
        }, 250);
    }

    function resetGame() {
        power = 0;
        isFinished = false;
        gaugeFill.style.width = '0%';
        resultModal.style.opacity = '0';
        modalContent.style.transform = 'scale(0.5)';
        smokeEffect.classList.remove('smoke-burst');
        
        setTimeout(() => {
            resultModal.style.display = 'none';
        }, 400);
    }
</script>
</body>
</html>
