<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>お店専用・肩乗りかき太郎カメラ</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        #app-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        video.mirror {
            transform: scaleX(-1);
        }

        canvas {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
            z-index: 10;
        }

        #switch-btn {
            position: absolute;
            top: 25px;
            right: 25px;
            width: 50px;
            height: 50px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            cursor: pointer;
            z-index: 25;
            display: flex;
            justify-content: center;
            align-items: center;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }
        #switch-btn svg {
            width: 26px;
            height: 26px;
            fill: white;
        }

        #shutter-btn {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 78px;
            height: 78px;
            background: rgba(255, 255, 255, 0.95);
            border: 6px solid rgba(255, 255, 255, 0.35);
            border-radius: 50%;
            cursor: pointer;
            z-index: 20;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        #loading {
            position: absolute;
            color: white;
            font-size: 15px;
            background: rgba(0,0,0,0.75);
            padding: 12px 24px;
            border-radius: 25px;
            z-index: 30;
            pointer-events: none;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        #result-container {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 40;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        #result-image {
            max-width: 100%;
            max-height: 72vh;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.7);
            object-fit: contain;
        }

        #result-msg {
            color: white;
            font-size: 15px;
            margin-top: 18px;
            text-align: center;
            font-weight: bold;
            line-height: 1.6;
        }

        #close-btn {
            margin-top: 20px;
            padding: 14px 36px;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 28px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div id="app-container">
    <video id="webcam" class="mirror" autoplay playsinline></video>
    <canvas id="output_canvas"></canvas>
    
    <button id="switch-btn" aria-label="カメラを切り替える">
        <svg viewBox="0 0 24 24">
            <path d="M19 8l-4 4h3c0 3.31-2.69 6-6 6-1.01 0-1.97-.25-2.8-.7l-1.46 1.46C8.97 19.54 10.43 20 12 20c4.42 0 8-3.58 8-8h3l-4-4zM6 12c0-3.31 2.69-6 6-6 1.01 0 1.97.25 2.8.7l1.46-1.46C15.03 4.46 13.57 4 12 4c-4.42 0-8 3.58-8 8H1l4 4 4-4H6z"/>
        </svg>
    </button>

    <button id="shutter-btn" aria-label="写真を撮る"></button>
    <div id="loading">🦪 かき太郎を呼んでいます...</div>
</div>

<div id="result-container">
    <img id="result-image" src="" alt="撮影された写真">
    <div id="result-msg">📷 写真を長押しして<br>「画像に保存」または「ダウンロード」をえらんでね！</div>
    <button id="close-btn">もう一度撮る</button>
</div>

<script>
const video = document.getElementById('webcam');
const canvas = document.getElementById('output_canvas');
const ctx = canvas.getContext('2d');
const loading = document.getElementById('loading');
const shutterBtn = document.getElementById('shutter-btn');
const switchBtn = document.getElementById('switch-btn');
const resultContainer = document.getElementById('result-container');
const resultImage = document.getElementById('result-image');
const closeBtn = document.getElementById('close-btn');

const charImg = new Image();
charImg.src = 'kakitaro.png'; 

let currentFacingMode = 'user'; 
let activeCamera = null;

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

const faceMesh = new FaceMesh({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
});

faceMesh.setOptions({
    maxNumFaces: 4, 
    refineLandmarks: true,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
});

faceMesh.onResults((results) => {
    // 📸 カメラさえ動けば、画像がなくても「呼んでいます」の文字を消すように修正
    loading.style.display = 'none';
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        for (let i = 0; i < results.multiFaceLandmarks.length; i++) {
            const landmarks = results.multiFaceLandmarks[i];
            
            let anchorPoint = (currentFacingMode === 'user') ? landmarks[21] : landmarks[251]; 
            let x = (currentFacingMode === 'user') ? (1 - anchorPoint.x) * canvas.width : anchorPoint.x * canvas.width;
            const y = anchorPoint.y * canvas.height;
            
            const chin = landmarks[152];
            const forehead = landmarks[10];
            const faceSize = Math.abs(chin.y - forehead.y) * canvas.height;
            
            const charWidth = faceSize * 1.3;  
            const charHeight = faceSize * 1.3; 
            
            const charX = x - charWidth * 1.2; 
            const charY = y + charHeight * 0.4;

            // ⚠️ 画像が壊れていたり無くても、エラーで全体を止めない安全装置
            if (charImg.complete && charImg.naturalWidth > 0) {
                ctx.drawImage(charImg, charX, charY, charWidth, charHeight);
            }
        }
    }
});

function startCamera(facingMode) {
    loading.style.display = 'block';
    if (activeCamera) { activeCamera.stop(); }

    if (facingMode === 'user') {
        video.classList.add('mirror');
    } else {
        video.classList.remove('mirror');
    }

    activeCamera = new Camera(video, {
        onFrame: async () => { await faceMesh.send({ image: video }); },
        width: 1280,
        height: 720,
        facingMode: facingMode
    });

    activeCamera.start().catch(err => {
        // スマホ側で過去に「拒否」が記憶されている場合、案内を出します
        loading.innerText = "❌ カメラのアクセスを許可してください（スマホの設定画面を確認）";
    });
}

// 🚀 AIの準備を待たずに、とにかく真っ先にカメラの起動を命令する
startCamera(currentFacingMode);

switchBtn.addEventListener('click', () => {
    currentFacingMode = (currentFacingMode === 'user') ? 'environment' : 'user';
    startCamera(currentFacingMode);
});

shutterBtn.addEventListener('click', () => {
    const saveCanvas = document.createElement('canvas');
    saveCanvas.width = canvas.width;
    saveCanvas.height = canvas.height;
    const saveCtx = saveCanvas.getContext('2d');

    if (currentFacingMode === 'user') {
        saveCtx.translate(saveCanvas.width, 0);
        saveCtx.scale(-1, 1); 
        saveCtx.drawImage(video, 0, 0, saveCanvas.width, saveCanvas.height);
        saveCtx.setTransform(1, 0, 0, 1, 0, 0); 
    } else {
        saveCtx.drawImage(video, 0, 0, saveCanvas.width, saveCanvas.height);
    }

    saveCtx.drawImage(canvas, 0, 0);
    resultImage.src = saveCanvas.toDataURL('image/jpeg', 0.85);
    resultContainer.style.display = 'flex';
});

closeBtn.addEventListener('click', () => {
    resultContainer.style.display = 'none';
});
</script>
</body>
</html>
