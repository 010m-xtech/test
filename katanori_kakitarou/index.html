<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ビーチのバーチャル背景・肩乗りかき太郎カメラ</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        #app-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-color: #000;
        }

        /* 📸 メインの描画画面（ここに海、切り抜かれた人、かき太郎をすべて合成して映します） */
        canvas#output_canvas {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 10;
        }

        /* 🔄 カメラ切り替えボタン（画面右上） */
        #switch-btn {
            position: absolute;
            top: 25px;
            right: 25px;
            width: 50px;
            height: 50px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            cursor: pointer;
            z-index: 25;
            display: flex;
            justify-content: center;
            align-items: center;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }
        #switch-btn svg {
            width: 26px;
            height: 26px;
            fill: white;
        }

        /* シャッターボタン */
        #shutter-btn {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 78px;
            height: 78px;
            background: rgba(255, 255, 255, 0.95);
            border: 6px solid rgba(255, 255, 255, 0.35);
            border-radius: 50%;
            cursor: pointer;
            z-index: 20;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        #loading {
            position: absolute;
            color: white;
            font-size: 15px;
            background: rgba(0,0,0,0.75);
            padding: 12px 24px;
            border-radius: 25px;
            z-index: 30;
            pointer-events: none;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        /* 📸 撮影後の確認画面 */
        #result-container {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 40;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        #result-image {
            max-width: 100%;
            max-height: 72vh;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.7);
            object-fit: contain;
        }

        #result-msg {
            color: white;
            font-size: 15px;
            margin-top: 18px;
            text-align: center;
            font-weight: bold;
            line-height: 1.6;
        }

        #close-btn {
            margin-top: 20px;
            padding: 14px 36px;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 28px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

<video id="webcam" style="display:none;" autoplay playsinline></video>
<canvas id="mask_canvas" style="display:none;"></canvas>

<div id="app-container">
    <canvas id="output_canvas"></canvas> <button id="switch-btn" aria-label="カメラを切り替える">
        <svg viewBox="0 0 24 24">
            <path d="M19 8l-4 4h3c0 3.31-2.69 6-6 6-1.01 0-1.97-.25-2.8-.7l-1.46 1.46C8.97 19.54 10.43 20 12 20c4.42 0 8-3.58 8-8h3l-4-4zM6 12c0-3.31 2.69-6 6-6 1.01 0 1.97.25 2.8.7l1.46-1.46C15.03 4.46 13.57 4 12 4c-4.42 0-8 3.58-8 8H1l4 4 4-4H6z"/>
        </svg>
    </button>

    <button id="shutter-btn" aria-label="写真を撮る"></button>
    <div id="loading">🦪 ビーチのカメラを準備中...</div>
</div>

<div id="result-container">
    <img id="result-image" src="" alt="撮影された写真">
    <div id="result-msg">📷 写真を長押しして<br>「画像に保存」または「ダウンロード」をえらんでね！</div>
    <button id="close-btn">もう一度撮る</button>
</div>

<script>
const video = document.getElementById('webcam');
const maskCanvas = document.getElementById('mask_canvas');
const maskCtx = maskCanvas.getContext('2d');
const outputCanvas = document.getElementById('output_canvas');
const ctx = outputCanvas.getContext('2d');

const loading = document.getElementById('loading');
const shutterBtn = document.getElementById('shutter-btn');
const switchBtn = document.getElementById('switch-btn');
const resultContainer = document.getElementById('result-container');
const resultImage = document.getElementById('result-image');
const closeBtn = document.getElementById('close-btn');

// --- 🦪 画像の読み込み ---
const charImg = new Image();
charImg.src = 'kakitaro.png'; 

const beachBgImg = new Image();
beachBgImg.src = 'beach_bg.jpg'; // ★先ほどの浜辺の画像ファイル名

let currentFacingMode = 'user'; 
let activeCamera = null;
let latestFaceResults = null;

function resizeCanvas() {
    outputCanvas.width = window.innerWidth;
    outputCanvas.height = window.innerHeight;
    maskCanvas.width = window.innerWidth;
    maskCanvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// 🚀 1. 顔認識AIの設定
const faceMesh = new FaceMesh({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
});
faceMesh.setOptions({
    maxNumFaces: 4, 
    refineLandmarks: true,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
});
faceMesh.onResults((results) => {
    latestFaceResults = results; // 顔の位置データを記憶
});

// 🚀 2. 人物切り抜きAIの設定
const selfieSegmentation = new SelfieSegmentation({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`
});
selfieSegmentation.setOptions({ modelSelection: 1 }); // 高精度モデル

// 🌊 切り抜きと浜辺背景合成のメイン処理
selfieSegmentation.onResults((results) => {
    loading.style.display = 'none';
    
    // ① まず画面全体に浜辺の背景を描画
    ctx.save();
    ctx.clearRect(0, 0, outputCanvas.width, outputCanvas.height);
    if (beachBgImg.complete && beachBgImg.naturalWidth > 0) {
        ctx.drawImage(beachBgImg, 0, 0, outputCanvas.width, outputCanvas.height);
    } else {
        ctx.fillStyle = '#add8e6';
        ctx.fillRect(0, 0, outputCanvas.width, outputCanvas.height);
    }

    // ② 自撮りモードなら画面を鏡反転させる（人物描画用）
    if (currentFacingMode === 'user') {
        ctx.translate(outputCanvas.width, 0);
        ctx.scale(-1, 1);
    }

    // ③ 切り抜きマスク（人間の形）を作って、人物だけを100%クッキリ描画
    maskCtx.clearRect(0, 0, maskCanvas.width, maskCanvas.height);
    maskCtx.drawImage(results.segmentationMask, 0, 0, maskCanvas.width, maskCanvas.height);
    
    ctx.globalCompositeOperation = 'destination-out';
    ctx.drawImage(maskCanvas, 0, 0, outputCanvas.width, outputCanvas.height);
    
    ctx.globalCompositeOperation = 'destination-over';
    ctx.drawImage(results.image, 0, 0, outputCanvas.width, outputCanvas.height);
    ctx.restore(); // 反転や合成モードをリセット

    // ④ 切り抜かれた人間の手前に、スリムなかき太郎を人数分描画
    if (latestFaceResults && latestFaceResults.multiFaceLandmarks && latestFaceResults.multiFaceLandmarks.length > 0) {
        for (let i = 0; i < latestFaceResults.multiFaceLandmarks.length; i++) {
            const landmarks = latestFaceResults.multiFaceLandmarks[i];
            
            let anchorPoint = (currentFacingMode === 'user') ? landmarks[21] : landmarks[251]; 
            let x = (currentFacingMode === 'user') ? (1 - anchorPoint.x) * outputCanvas.width : anchorPoint.x * outputCanvas.width;
            const y = anchorPoint.y * outputCanvas.height;
            
            const chin = landmarks[152];
            const forehead = landmarks[10];
            const faceSize = Math.abs(chin.y - forehead.y) * outputCanvas.height;
            
            // 💡 かき太郎専用の縦長スリム比率
            const charWidth = faceSize * 0.85;  
            const charHeight = faceSize * 1.4; 
            
            // 📐 足元がしっかり肩に乗る絶妙な配置コード
            const charX = x - charWidth * 1.95; 
            const charY = y + charHeight * 0.05;

            if (charImg.complete && charImg.naturalWidth > 0) {
                ctx.drawImage(charImg, charX, charY, charWidth, charHeight);
            }
        }
    }
});

// 📸 カメラの起動
function startCamera(facingMode) {
    loading.style.display = 'block';
    if (activeCamera) { activeCamera.stop(); }

    activeCamera = new Camera(video, {
        onFrame: async () => {
            // 2つのAIに同時にカメラ映像を送って超高速処理
            await faceMesh.send({ image: video });
            await selfieSegmentation.send({ image: video });
        },
        width: 1280,
        height: 720,
        facingMode: facingMode
    });

    activeCamera.start().catch(err => {
        loading.innerText = "❌ カメラのアクセスを許可してください（スマホの設定画面を確認）";
    });
}

startCamera(currentFacingMode);

switchBtn.addEventListener('click', () => {
    currentFacingMode = (currentFacingMode === 'user') ? 'environment' : 'user';
    startCamera(currentFacingMode);
});

// 📸 写真撮影システム（画面に映っている綺麗な切り抜き状態をそのままパシャリ！）
shutterBtn.addEventListener('click', () => {
    resultImage.src = outputCanvas.toDataURL('image/jpeg', 0.9);
    resultContainer.style.display = 'flex';
});

closeBtn.addEventListener('click', () => {
    resultContainer.style.display = 'none';
});
</script>
</body>
</html>
