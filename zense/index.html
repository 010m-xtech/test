<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>前世診断</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background-color: #0d0e15;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* 全体コンテナ */
    .container {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    /* 画面切り替えクラス */
    .screen {
      display: none;
      width: 100%;
      min-height: 100vh;
      padding: 25px 20px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .screen.active {
      display: flex;
    }

    /* ① 設問画面：背景画像「background.jpg」 */
    #quiz-screen {
      background-image: url('background.jpg'); 
      background-repeat: no-repeat;
      background-position: center center;
      background-size: cover;
      background-attachment: fixed;
    }

    #quiz-screen::before {
      content: "";
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: rgba(10, 15, 30, 0.75);
      z-index: 1;
    }

    .quiz-content {
      position: relative;
      z-index: 2;
      width: 100%;
    }

    h1 {
      font-size: 2.2rem;
      color: #ff3366;
      margin-bottom: 10px;
      text-shadow: 0 0 10px rgba(255, 51, 102, 0.8);
      text-align: center;
      font-weight: bold;
    }

    p.subtitle {
      font-size: 0.95rem;
      color: #e0e0e0;
      line-height: 1.6;
      margin-bottom: 25px;
      text-align: center;
    }

    /* フォーム要素 */
    .form-group {
      width: 100%;
      margin-bottom: 18px;
      text-align: left;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.95rem;
      color: #f0f0f0;
      font-weight: bold;
      line-height: 1.4;
    }

    select {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background-color: rgba(20, 25, 45, 0.85);
      color: #fff;
      font-size: 0.95rem;
      backdrop-filter: blur(5px);
      outline: none;
      -webkit-appearance: none;
    }

    select:focus {
      border-color: #ff3366;
      box-shadow: 0 0 10px rgba(255, 51, 102, 0.3);
    }

    .select-wrapper {
      position: relative;
      width: 100%;
    }
    .select-wrapper::after {
      content: '▼';
      font-size: 0.8rem;
      color: #ccc;
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
    }

    /* 生年月日：年月日 横並びレイアウト */
    .birth-group {
      display: flex;
      gap: 8px;
    }
    .birth-group .select-wrapper { flex: 1; }
    .birth-group select { padding: 14px 8px; text-align: center; }

    /* ボタンデザイン */
    .btn {
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 35px;
      background: linear-gradient(45deg, #ff3366, #ff6633);
      color: white;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 25px rgba(255, 51, 102, 0.6);
      margin-top: 15px;
      transition: transform 0.1s, box-shadow 0.2s;
    }

    .btn:active { transform: scale(0.97); }

    /* ② 動画再生画面 */
    #video-screen {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: #000;
      z-index: 100;
      display: none;
    }

    #time-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* ③ 結果画面：背景画像「result_bg.jpg」 */
    #result-screen {
      background-image: url('result_bg.jpg'); 
      background-repeat: no-repeat;
      background-position: center center;
      background-size: cover;
      background-attachment: fixed;
    }

    #result-screen::before {
      content: "";
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: rgba(10, 10, 20, 0.65);
      z-index: 1;
    }

    .result-content {
      position: relative;
      z-index: 2;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 🎨 作り込んだ1枚の豪華診断結果カード */
    .result-card {
      background: rgba(18, 22, 40, 0.92);
      border-radius: 20px;
      padding: 20px;
      border: 2px solid #ff3366;
      box-shadow: 0 0 25px rgba(255, 51, 102, 0.4);
      backdrop-filter: blur(12px);
      width: 100%;
      text-align: center;
      margin-bottom: 15px;
    }

    .category-badge {
      display: inline-block;
      padding: 5px 15px;
      background-color: #ff3366;
      border-radius: 15px;
      font-size: 0.8rem;
      font-weight: bold;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

    /* イラスト表示エリア */
    .hero-img-container {
      width: 100%;
      height: 180px;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .hero-img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .past-life-title {
      font-size: 1.5rem;
      color: #ffd700;
      margin-bottom: 12px;
      font-weight: bold;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
      line-height: 1.3;
    }

    /* エピソードボックス */
    .story-box {
      background: rgba(0, 0, 0, 0.4);
      border-left: 3px solid #ff3366;
      padding: 10px 12px;
      border-radius: 0 8px 8px 0;
      font-size: 0.88rem;
      line-height: 1.5;
      color: #e0e0e0;
      text-align: left;
      margin-bottom: 12px;
    }

    /* 現世への影響ボックス */
    .impact-box {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      padding: 10px;
      text-align: left;
      margin-bottom: 12px;
      font-size: 0.85rem;
      line-height: 1.4;
    }
    .impact-item { margin-bottom: 6px; }
    .impact-item:last-child { margin-bottom: 0; }
    .impact-tag-talent { color: #4deeea; font-weight: bold; }
    .impact-tag-weak { color: #ff6b6b; font-weight: bold; }

    /* 相性＆メニュー */
    .sub-info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .sub-box {
      background: rgba(0, 0, 0, 0.5);
      padding: 10px 8px;
      border-radius: 10px;
      border: 1px dashed rgba(255, 255, 255, 0.2);
      font-size: 0.8rem;
    }
    .sub-box-title { color: #ff9933; font-size: 0.75rem; margin-bottom: 4px; font-weight: bold; }
    .sub-box-value { color: #fff; font-weight: bold; font-size: 0.9rem; }
  </style>
</head>
<body>

  <div class="container">

    <div id="quiz-screen" class="screen active">
      <div class="quiz-content">
        <h1>前世診断</h1>
        <p class="subtitle">普段の何気ない行動から、あなたの前世を占います。<br>直感でお答えください。</p>

        <div class="form-group">
          <label>① 生年月日</label>
          <div class="birth-group">
            <div class="select-wrapper"><select id="birth-year"></select></div>
            <div class="select-wrapper"><select id="birth-month"></select></div>
            <div class="select-wrapper"><select id="birth-day"></select></div>
          </div>
        </div>

        <div id="random-questions-container"></div>

        <button class="btn" onclick="startTimeSlip()">⏳ 前世へタイムスリップ！</button>
      </div>
    </div>

    <div id="video-screen">
      <video id="time-video" playsinline muted webkit-playsinline preload="auto">
        <source src="time-travel.mp4" type="video/mp4">
      </video>
    </div>

    <div id="result-screen" class="screen">
      <div class="result-content">
        <div class="result-card">
          <span class="category-badge" id="res-category">カテゴリ</span>
          
          <div class="hero-img-container">
            <img id="res-img" src="" alt="前世イラスト">
          </div>

          <div class="past-life-title" id="res-title">称号が入ります</div>

          <div class="story-box">
            <strong>📜 前世の物語:</strong><br>
            <span id="res-story">ここに短いエピソードが入ります。</span>
          </div>

          <div class="impact-box">
            <div class="impact-item">
              <span class="impact-tag-talent">✨ 今の才能：</span>
              <span id="res-talent">才能の説明</span>
            </div>
            <div class="impact-item">
              <span class="impact-tag-weak">🌀 今の弱点：</span>
              <span id="res-weak">弱点の説明</span>
            </div>
          </div>

          <div class="sub-info-grid">
            <div class="sub-box">
              <div class="sub-box-title">💖 相性バツグン</div>
              <div class="sub-box-value" id="res-match">相性の良い前世</div>
            </div>
            <div class="sub-box">
              <div class="sub-box-title">🍺 愛したソウルフード</div>
              <div class="sub-box-value" id="res-menu">メニュー名</div>
            </div>
          </div>
        </div>

        <button class="btn" onclick="resetQuiz()">🔄 もう一度診断する</button>
      </div>
    </div>

  </div>

        story: "静寂に包まれた図書室で、たくさんの物語を守り続けた。ひそかに訪れる人々にぴったりの一冊を差し出すのが喜びだった。",

    window.onload = function() {
      initBirthdateSelects();
      generateRandomQuestions();
    };

    function initBirthdateSelects() {
      const yearSelect = document.getElementById('birth-year');
      const monthSelect = document.getElementById('birth-month');
      const daySelect = document.getElementById('birth-day');

      yearSelect.innerHTML = ''; monthSelect.innerHTML = ''; daySelect.innerHTML = '';

      for (let y = 1940; y <= 2026; y++) {
        const option = document.createElement('option');
        option.value = y; option.text = y + "年";
        if (y === 2000) option.selected = true;
        yearSelect.appendChild(option);
      }
      for (let m = 1; m <= 12; m++) {
        const option = document.createElement('option');
        option.value = m; option.text = m + "月";
        if (m === 1) option.selected = true;
        monthSelect.appendChild(option);
      }
      for (let d = 1; d <= 31; d++) {
        const option = document.createElement('option');
        option.value = d; option.text = d + "日";
        if (d === 1) option.selected = true;
        daySelect.appendChild(option);
      }
    }

    function generateRandomQuestions() {
      const container = document.getElementById('random-questions-container');
      container.innerHTML = '';

      const shuffled = [...questionPool].sort(() => 0.5 - Math.random());
      const selectedQuestions = shuffled.slice(0, 4);
      const numberPrefixes = ["②", "③", "④", "⑤"];

      selectedQuestions.forEach((q, index) => {
        const formGroup = document.createElement('div');
        formGroup.className = 'form-group';

        const label = document.createElement('label');
        label.innerText = `${numberPrefixes[index]} ${q.text}`;

        const wrapper = document.createElement('div');
        wrapper.className = 'select-wrapper';

        const select = document.createElement('select');
        select.className = 'random-q-select';

        q.options.forEach((optText, optIndex) => {
          const option = document.createElement('option');
          option.value = optIndex + 1;
          option.text = optText;
          select.appendChild(option);
        });

        wrapper.appendChild(select);
        formGroup.appendChild(label);
        formGroup.appendChild(wrapper);
        container.appendChild(formGroup);
      });
    }

    function startTimeSlip() {
      const quizScreen = document.getElementById('quiz-screen');
      const videoScreen = document.getElementById('video-screen');
      const video = document.getElementById('time-video');

      quizScreen.classList.remove('active');
      videoScreen.style.display = 'block';

      video.currentTime = 0;
      video.muted = true;
      
      const playPromise = video.play();
      if (playPromise !== undefined) {
        playPromise.catch(error => {
          console.error("動画再生エラー:", error);
          videoScreen.style.display = 'none';
          showResult();
        });
      }

      video.onended = function() {
        videoScreen.style.display = 'none';
        showResult();
      };
    }

    function showResult() {
      const randomSelects = document.querySelectorAll('.random-q-select');
      let randomScore = 0;
      randomSelects.forEach(select => {
        randomScore += parseInt(select.value);
      });

      const year = parseInt(document.getElementById('birth-year').value);
      const month = parseInt(document.getElementById('birth-month').value);
      const day = parseInt(document.getElementById('birth-day').value);
      const birthNum = year + month + day;
      
      // 10パターンの結果に正確に振分け（0〜9）
      const totalScore = randomScore + birthNum;
      const index = totalScore % results.length;
      const res = results[index];

      // カード各要素へデータ挿入
      document.getElementById('res-category').innerText = res.category;
      document.getElementById('res-img').src = res.img;
      document.getElementById('res-title').innerText = res.title;
      document.getElementById('res-story').innerText = res.story;
      document.getElementById('res-talent').innerText = res.talent;
      document.getElementById('res-weak').innerText = res.weak;
      document.getElementById('res-match').innerText = res.match;
      document.getElementById('res-menu').innerText = res.menu;

      document.getElementById('result-screen').classList.add('active');
    }

    function resetQuiz() {
      generateRandomQuestions();
      document.getElementById('result-screen').classList.remove('active');
      document.getElementById('quiz-screen').classList.add('active');
    }
  </script>
</body>
</html>
