<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>前世タイムスリップ診断</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background-color: #0d0e15;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* 全体コンテナ */
    .container {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    /* 画面切り替えクラス */
    .screen {
      display: none;
      width: 100%;
      min-height: 100vh;
      padding: 30px 20px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .screen.active {
      display: flex;
    }

    /* ① 設問画面：指定の背景画像を設定 */
    #quiz-screen {
      /* 添付2枚目の画像を背景に指定 */
      background: url('スクリーンショット 2026-07-27 173118.jpg') no-repeat center center / cover;
      position: relative;
    }

    /* 文字を読みやすくするための暗めオーバーレイ */
    #quiz-screen::before {
      content: "";
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(10, 15, 30, 0.75); /* 画像の上に半透明の濃紺を重ねる */
      z-index: 1;
    }

    /* 設問コンテンツを前面に配置 */
    .quiz-content {
      position: relative;
      z-index: 2;
      width: 100%;
    }

    h1 {
      font-size: 1.8rem;
      color: #ff3366;
      margin-bottom: 8px;
      text-shadow: 0 0 10px rgba(255, 51, 102, 0.5);
    }

    p.subtitle {
      font-size: 0.95rem;
      color: #e0e0e0;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    /* フォーム要素 */
    .form-group {
      width: 100%;
      margin-bottom: 15px;
      text-align: left;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.9rem;
      color: #f0f0f0;
      font-weight: bold;
    }

    select, input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(20, 25, 45, 0.85);
      color: #fff;
      font-size: 0.95rem;
      backdrop-filter: blur(5px);
      outline: none;
    }

    select:focus, input:focus {
      border-color: #ff3366;
    }

    /* ボタンデザイン */
    .btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 30px;
      background: linear-gradient(45deg, #ff3366, #ff6633);
      color: white;
      font-size: 1.15rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(255, 51, 102, 0.5);
      margin-top: 15px;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn:active {
      transform: scale(0.98);
    }

    /* ② 動画再生画面（全画面表示） */
    #video-screen {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: #000;
      z-index: 100;
      display: none;
    }

    #time-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* ③ 結果画面 */
    #result-screen {
      background: radial-gradient(circle at center, #1a1f36 0%, #0d0e15 100%);
    }

    .result-card {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 20px;
      padding: 25px 20px;
      border: 1px solid rgba(255, 51, 102, 0.3);
      box-shadow: 0 0 30px rgba(255, 51, 102, 0.2);
      backdrop-filter: blur(10px);
      width: 100%;
    }

    .category-badge {
      display: inline-block;
      padding: 6px 16px;
      background: #ff3366;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: bold;
      margin-bottom: 12px;
      letter-spacing: 1px;
    }

    .past-life-title {
      font-size: 1.6rem;
      color: #ffd700;
      margin-bottom: 15px;
      font-weight: bold;
      text-shadow: 0 0 8px rgba(255, 215, 0, 0.4);
    }

    .past-life-desc {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #dcdcdc;
      margin-bottom: 20px;
    }

    .menu-box {
      background: rgba(0, 0, 0, 0.4);
      padding: 15px;
      border-radius: 12px;
      border: 1px dashed #ff9933;
    }

    .menu-title {
      font-size: 0.85rem;
      color: #ff9933;
      margin-bottom: 5px;
    }

    .menu-name {
      font-size: 1.25rem;
      font-weight: bold;
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="container">

    <div id="quiz-screen" class="screen active">
      <div class="quiz-content">
        <h1>前世タイムスリップ診断</h1>
        <p class="subtitle">時空を超えて、あなたの前世の記憶を巡ります。<br>直感でお答えください。</p>

        <div class="form-group">
          <label>① 生年月日</label>
          <input type="date" id="birthdate" required>
        </div>

        <div class="form-group">
          <label>② 性別</label>
          <select id="gender">
            <option value="1">回答しない / その他</option>
            <option value="2">男性</option>
            <option value="3">女性</option>
          </select>
        </div>

        <div class="form-group">
          <label>③ お風呂で最初どこから洗う？</label>
          <select id="q1">
            <option value="1">頭</option>
            <option value="2">顔</option>
            <option value="3">右手・左手</option>
            <option value="4">胸・お腹</option>
            <option value="5">足</option>
          </select>
        </div>

        <div class="form-group">
          <label>④ レストランでメニューを選ぶ時は？</label>
          <select id="q2">
            <option value="1">直感で即決</option>
            <option value="2">一番人気の定番</option>
            <option value="3">期間限定・珍しいもの</option>
            <option value="4">迷った末に一緒の人と同じにする</option>
          </select>
        </div>

        <div class="form-group">
          <label>⑤ 集中している時の無意識のクセは？</label>
          <select id="q3">
            <option value="1">腕組みをする</option>
            <option value="2">髪や顔を触る</option>
            <option value="3">貧乏ゆすり・足を組む</option>
            <option value="4">ぼーっと一箇所を見つめる</option>
          </select>
        </div>

        <button class="btn" onclick="startTimeSlip()">⏳ 前世へタイムスリップ！</button>
      </div>
    </div>

    <div id="video-screen">
      <video id="time-video" playsinline muted webkit-playsinline preload="auto">
        <source src="time-travel.mp4" type="video/mp4">
      </video>
    </div>

    <div id="result-screen" class="screen">
      <div class="result-card">
        <span class="category-badge" id="res-category">王道・英雄系</span>
        <div class="past-life-title" id="res-title">中世の伝説の騎士</div>
        <p class="past-life-desc" id="res-desc">仲間を命懸けで守る誇り高き英雄！正義感が強く、頼りにされるリーダータイプです。</p>

        <div class="menu-box">
          <div class="menu-title">🍺 前世のあなたが愛したソウルフード</div>
          <div class="menu-name" id="res-menu">【豪快！骨付き肉のステーキ】</div>
        </div>
      </div>

      <button class="btn" onclick="resetQuiz()">🔄 もう一度診断する</button>
    </div>

  </div>

  <script>
    // 診断データ
    const results = [
      {
        category: "王道・英雄系",
        title: "🛡️ 中世の伝説の騎士",
        desc: "仲間を命懸けで守る誇り高き英雄！正義感が強く、頼りにされるリーダータイプです。",
        menu: "豪快！肉料理・ステーキ"
      },
      {
        category: "江戸・歴史系",
        title: "👘 大繁盛した江戸の商人",
        desc: "人とのご縁を結ぶ天才！愛嬌と抜群のコミュ力でどこに行っても可愛がられる商売上手。",
        menu: "ふわふわ出汁巻き卵"
      },
      {
        category: "動物・自然系",
        title: "🐾 城下町の気ままな野良猫",
        desc: "自分の心地よさを一番知っている愛されキャラ。マイペースだけど放っておけない魅力の持ち主。",
        menu: "香ばしい炙りエイヒレ"
      },
      {
        category: "ファンタジー系",
        title: "🏴‍☠️ 大航海時代の海賊船長",
        desc: "束縛を嫌う自由人！誰も思いつかないアイデアでピンチをチャンスに変えるパワーがあります。",
        menu: "サクサク！フィッシュ＆チップス"
      },
      {
        category: "新発想系",
        title: "🚀 流れ星に乗ってきた宇宙の旅人",
        desc: "どこか浮世離れしたユニークな感性の持ち主。「普通」にとらわれない新しい風を吹き込みます。",
        menu: "あつあつ！揚げたこ焼き"
      }
    ];

    function startTimeSlip() {
      const quizScreen = document.getElementById('quiz-screen');
      const videoScreen = document.getElementById('video-screen');
      const video = document.getElementById('time-video');

      quizScreen.classList.remove('active');
      videoScreen.style.display = 'block';

      // 動画の再生
      video.currentTime = 0;
      video.muted = true; // スマホでの自動再生制限をクリアするためミュート化
      
      const playPromise = video.play();
      if (playPromise !== undefined) {
        playPromise.catch(error => {
          console.error("動画再生エラー:", error);
          // 万が一再生エラーが起きた場合はスキップして結果表示へ
          videoScreen.style.display = 'none';
          showResult();
        });
      }

      // 動画が終わったら結果画面に遷移
      video.onended = function() {
        videoScreen.style.display = 'none';
        showResult();
      };
    }

    function showResult() {
      const q1 = parseInt(document.getElementById('q1').value);
      const q2 = parseInt(document.getElementById('q2').value);
      const q3 = parseInt(document.getElementById('q3').value);
      
      const index = (q1 + q2 + q3) % results.length;
      const res = results[index];

      document.getElementById('res-category').innerText = res.category;
      document.getElementById('res-title').innerText = res.title;
      document.getElementById('res-desc').innerText = res.desc;
      document.getElementById('res-menu').innerText = `【${res.menu}】`;

      document.getElementById('result-screen').classList.add('active');
    }

    function resetQuiz() {
      document.getElementById('result-screen').classList.remove('active');
      document.getElementById('quiz-screen').classList.add('active');
    }
  </script>
</body>
</html>
