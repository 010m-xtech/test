<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>前世タイムスリップ占い</title>
  <style>
    /* 全体・スマホ向け縦型デザイン */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background-color: #1a1a2e;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .container {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      background: #16213e;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      text-align: center;
    }

    /* 画面切り替え用 */
    .screen { display: none; width: 100%; }
    .screen.active { display: flex; flex-direction: column; align-items: center; }

    /* 見出し・テキスト */
    h1 { font-size: 1.8rem; color: #e94560; margin-bottom: 10px; }
    h2 { font-size: 1.3rem; margin-bottom: 20px; color: #f2a365; }
    p { font-size: 1rem; line-height: 1.5; margin-bottom: 20px; }

    /* フォーム・ボタン */
    .form-group { width: 100%; margin-bottom: 15px; text-align: left; }
    label { display: block; margin-bottom: 5px; font-size: 0.9rem; color: #cccccc; }
    select, input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #0f3460;
      background: #0f3460;
      color: #fff;
      font-size: 1rem;
    }

    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 30px;
      background: linear-gradient(45deg, #ff416c, #ff4b2b);
      color: white;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 65, 108, 0.4);
      margin-top: 10px;
    }

    /* 動画画面 */
    #video-screen {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: black;
      z-index: 100;
      display: none;
    }
    #time-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* 診断結果画面 */
    .result-card {
      background: #0f3460;
      border-radius: 15px;
      padding: 20px;
      border: 2px solid #e94560;
      box-shadow: 0 0 20px rgba(233, 69, 96, 0.3);
      width: 100%;
    }
    .category-badge {
      display: inline-block;
      padding: 5px 15px;
      background: #e94560;
      border-radius: 15px;
      font-size: 0.8rem;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .past-life-title {
      font-size: 1.6rem;
      color: #ffd700;
      margin-bottom: 15px;
    }
    .menu-box {
      margin-top: 20px;
      background: #16213e;
      padding: 15px;
      border-radius: 10px;
      border: 1px dashed #f2a365;
    }
    .menu-title { font-size: 0.9rem; color: #f2a365; }
    .menu-name { font-size: 1.3rem; font-weight: bold; color: #fff; margin-top: 5px; }
  </style>
</head>
<body>

  <div class="container">

    <div id="quiz-screen" class="screen active">
      <h1>前世タイムスリップ診断</h1>
      <p>過去の記憶を呼び覚まします。<br>直感でお答えください。</p>

      <div class="form-group">
        <label>① 生年月日</label>
        <input type="date" id="birthdate" required>
      </div>

      <div class="form-group">
        <label>② 性別</label>
        <select id="gender">
          <option value="1">回答しない / その他</option>
          <option value="2">男性</option>
          <option value="3">女性</option>
        </select>
      </div>

      <div class="form-group">
        <label>③ お風呂で最初どこから洗う？</label>
        <select id="q1">
          <option value="1">頭</option>
          <option value="2">顔</option>
          <option value="3">右手・左手</option>
          <option value="4">胸・お腹</option>
          <option value="5">足</option>
        </select>
      </div>

      <div class="form-group">
        <label>④ レストランでメニューを選ぶ時は？</label>
        <select id="q2">
          <option value="1">直感で即決</option>
          <option value="2">一番人気の定番</option>
          <option value="3">期間限定・珍しいもの</option>
          <option value="4">迷った末に一緒の人と同じにする</option>
        </select>
      </div>

      <div class="form-group">
        <label>⑤ 集中している時の無意識のクセは？</label>
        <select id="q3">
          <option value="1">腕組みをする</option>
          <option value="2">髪や顔を触る</option>
          <option value="3">貧乏ゆすり・足を組む</option>
          <option value="4">ぼーっと一箇所を見つめる</option>
        </select>
      </div>

      <button class="btn" onclick="startTimeSlip()">⏳ 前世へタイムスリップ！</button>
    </div>

    <div id="video-screen">
      <video id="time-video" playsinline muted>
        <source src="http://googleusercontent.com/generated_video_content/499849120189438794" type="video/mp4">
      </video>
    </div>

    <div id="result-screen" class="screen">
      <div class="result-card">
        <span class="category-badge" id="res-category">王道・英雄系</span>
        <div class="past-life-title" id="res-title">中世の伝説の騎士</div>
        <p id="res-desc">仲間を命懸けで守る誇り高き英雄！正義感が強く、周りから頼りにされるリーダータイプです。</p>

        <div class="menu-box">
          <div class="menu-title">🍗 前世のあなたが愛したソウルフード</div>
          <div class="menu-name" id="res-menu">【豪快！骨付き肉のステーキ】</div>
        </div>
      </div>

      <button class="btn" onclick="resetQuiz()" style="margin-top: 20px;">🔄 もう一度診断する</button>
    </div>

  </div>

  <script>
    // 占いデータベース（30パターンの抜粋版）
    const results = [
      {
        category: "王道・英雄系",
        title: "🛡️ 中世の伝説の騎士",
        desc: "仲間を命懸けで守る誇り高き英雄！正義感が強く、頼りにされるリーダータイプです。",
        menu: "豪快！肉料理・ステーキ"
      },
      {
        category: "江戸・歴史系",
        title: "👘 大繁盛した江戸の商人",
        desc: "人とのご縁を結ぶ天才！愛嬌と抜群のコミュ力でどこに行っても可愛がられる商売上手。",
        menu: "ふわふわ出汁巻き卵"
      },
      {
        category: "動物・自然系",
        title: "🐾 城下町の気ままな野良猫",
        desc: "自分の心地よさを一番知っている愛されキャラ。マイペースだけど放っておけない魅力の持ち主。",
        menu: "香ばしい炙りエイヒレ"
      },
      {
        category: "ファンタジー系",
        title: "🏴‍☠️ 大航海時代の海賊船長",
        desc: "束縛を嫌う自由人！誰も思いつかないアイデアでピンチをチャンスに変えるパワーがあります。",
        menu: "サクサク！フィッシュ＆チップス"
      },
      {
        category: "新発想系",
        title: "🚀 流れ星に乗ってきた宇宙の旅人",
        desc: "どこか浮世離れしたユニークな感性の持ち主。「普通」にとらわれない新しい風を吹き込みます。",
        menu: "あつあつ！揚げたこ焼き"
      }
    ];

    // タイムスリップ開始（動画再生）
    function startTimeSlip() {
      const quizScreen = document.getElementById('quiz-screen');
      const videoScreen = document.getElementById('video-screen');
      const video = document.getElementById('time-video');

      quizScreen.classList.remove('active');
      videoScreen.style.display = 'block';

      // 動画再生
      video.currentTime = 0;
      video.play().catch(e => {
        // 自動再生制限対策（タップ直後のため基本OK）
        console.log(e);
      });

      // 動画が終わったら結果画面を表示
      video.onended = function() {
        videoScreen.style.display = 'none';
        showResult();
      };
    }

    // 結果表示ロジック
    function showResult() {
      // 質問の回答値を合算してランダム風に結果を分岐
      const q1 = parseInt(document.getElementById('q1').value);
      const q2 = parseInt(document.getElementById('q2').value);
      const q3 = parseInt(document.getElementById('q3').value);
      
      const index = (q1 + q2 + q3) % results.length;
      const res = results[index];

      document.getElementById('res-category').innerText = res.category;
      document.getElementById('res-title').innerText = res.title;
      document.getElementById('res-desc').innerText = res.desc;
      document.getElementById('res-menu').innerText = `【${res.menu}】`;

      document.getElementById('result-screen').classList.add('active');
    }

    // リセット
    function resetQuiz() {
      document.getElementById('result-screen').classList.remove('active');
      document.getElementById('quiz-screen').classList.add('active');
    }
  </script>
</body>
</html>
